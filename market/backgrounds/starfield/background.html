<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>星空</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        (function () {
            const cv = document.getElementById('c');
            const ctx = cv.getContext('2d');
            let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
            let stars = [], meteors = [], lastMeteor = 0;

            function resize() {
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                cv.style.width = W + 'px'; cv.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function init() {
                const n = Math.min(280, Math.floor(W * H / 6000));
                stars = [];
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.3 + 0.2,
                        a: Math.random() * Math.PI * 2,
                        s: Math.random() * 0.025 + 0.004,
                        hue: Math.random() < 0.15 ? 210 : (Math.random() < 0.5 ? 0 : 40)
                    });
                }
                meteors = [];
            }

            function spawnMeteor() {
                const fromTop = Math.random() < 0.5;
                meteors.push({
                    x: Math.random() * W,
                    y: fromTop ? -20 : Math.random() * H * 0.3,
                    vx: -(2.5 + Math.random() * 3),
                    vy: 4 + Math.random() * 4,
                    life: 0,
                    maxLife: 60 + Math.random() * 40,
                    len: 80 + Math.random() * 120
                });
            }

            function frame(t) {
                ctx.clearRect(0, 0, W, H);
                // 星星
                for (const st of stars) {
                    st.a += st.s;
                    const tw = 0.45 + 0.55 * Math.sin(st.a);
                    ctx.globalAlpha = tw;
                    if (st.hue === 0) ctx.fillStyle = '#ffffff';
                    else if (st.hue === 40) ctx.fillStyle = '#ffe9c4';
                    else ctx.fillStyle = '#b8d4ff';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                    // 较大星星加光晕
                    if (st.r > 1.0 && tw > 0.85) {
                        ctx.globalAlpha = (tw - 0.85) * 0.6;
                        ctx.beginPath();
                        ctx.arc(st.x, st.y, st.r * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                // 流星
                if (t - lastMeteor > 2200 + Math.random() * 3000) {
                    spawnMeteor();
                    lastMeteor = t;
                }
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.vx; m.y += m.vy; m.life++;
                    const alpha = Math.sin((m.life / m.maxLife) * Math.PI);
                    const tx = m.x - m.vx * m.len * 0.15;
                    const ty = m.y - m.vy * m.len * 0.15;
                    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
                    grad.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                    grad.addColorStop(0.4, 'rgba(180,210,255,' + alpha * 0.5 + ')');
                    grad.addColorStop(1, 'rgba(180,210,255,0)');
                    ctx.globalAlpha = 1;
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                    // 头部亮点
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 1.4, 0, Math.PI * 2);
                    ctx.fill();
                    if (m.life >= m.maxLife || m.x < -50 || m.y > H + 50) meteors.splice(i, 1);
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(frame);
            }

            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () { resize(); init(); }, 150);
            });
            resize(); init(); requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
