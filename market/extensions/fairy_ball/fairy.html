<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>精灵悬浮球</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 14px;
        }

        /* ============ 缩放层（大小档位，与精灵动画层分离互不干扰） ============ */
        .wrap {
            position: relative;
            width: 92px;
            height: 92px;
            transform-origin: bottom center;
            transition: transform .18s ease-out;
        }

        .wrap[data-size="s"] {
            transform: scale(.72);
        }

        .wrap[data-size="m"] {
            transform: scale(1);
        }

        .wrap[data-size="l"] {
            transform: scale(1.28);
        }

        /* ============ 精灵容器（公共） ============ */
        /* 皮肤配色变量（默认值 = 星尘兜底；各皮肤在自身 [data-skin] 段完整覆盖）
           形态拆分：公共骨架类（body/eyes/eye/cheek/mouth/shadow）只定布局基类，
           尺寸/形状/位置/专属元素全部在各皮肤段定义 —— 五款形态完全不同 */
        .fairy {
            --c1: #7aa6ff;
            --c1b: #8fd4ff;
            --c2: #5b8cff;
            --c3: #a78bfa;
            --glow: rgba(91, 140, 255, .35);
            --glow2: rgba(110, 160, 255, .65);
            --pupil: #221c3a;
            --blush: rgba(255, 120, 150, .5);
            --mouthc: #3a2f57;
            position: relative;
            width: 92px;
            height: 92px;
            cursor: pointer;
            animation: floaty 3.2s ease-in-out infinite;
            transition: filter .4s;
            z-index: 2;
        }

        /* —— 公共骨架：仅定位/通用动画，不含尺寸 —— */
        .fairy .body {
            position: absolute;
        }

        .fairy .eyes {
            position: absolute;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        .fairy .eye {
            position: relative;
            background: #fff;
            border-radius: 50%;
            animation: blink 4.4s infinite;
            box-shadow: inset 0 -1px 2px rgba(60, 60, 110, .2);
        }

        .fairy .eye::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: var(--pupil);
            /* 瞳孔看向鼠标：偏移由 JS 写 --lk-x/--lk-y（挂在 .fairy 上），与皮肤段 left/top 基准正交叠加 */
            transform: translate(var(--lk-x, 0px), var(--lk-y, 0px));
        }

        .fairy .eye::before {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .95);
            z-index: 1;
            /* 高光同步瞳孔偏移（保持高光在瞳孔上） */
            transform: translate(var(--lk-x, 0px), var(--lk-y, 0px));
        }

        .fairy .cheek {
            position: absolute;
            border-radius: 50%;
            background: var(--blush);
            filter: blur(1px);
        }

        .fairy .mouth {
            position: absolute;
            left: 50%;
            background: var(--mouthc);
            transition: all .25s;
        }

        .fairy .shadow {
            position: absolute;
            left: 50%;
            border-radius: 50%;
            background: rgba(20, 26, 48, .35);
            filter: blur(3px);
            animation: shadowPulse 3.2s ease-in-out infinite;
        }

        .fairy .spark {
            position: absolute;
            top: 20px;
            left: 50%;
            font-size: 15px;
            opacity: 0;
            pointer-events: none;
            z-index: 4;
        }

        .spark.go {
            animation: sparkle .8s ease-out;
        }

        /* ============ 皮肤一：星尘（圆球精灵，原默认款） ============ */
        .fairy[data-skin="stardust"] {
            --c1: #7aa6ff;
            --c1b: #8fd4ff;
            --c2: #5b8cff;
            --c3: #a78bfa;
            --glow: rgba(91, 140, 255, .35);
            --glow2: rgba(110, 160, 255, .65);
            --pupil: #221c3a;
            --blush: rgba(255, 120, 150, .5);
            --mouthc: #3a2f57;
        }

        .fairy[data-skin="stardust"] .body {
            left: 0;
            top: 0;
            width: 92px;
            height: 92px;
            border-radius: 46% 46% 50% 50%;
            background:
                radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .55), transparent 42%),
                radial-gradient(circle at 68% 74%, rgba(124, 88, 222, .45), transparent 52%),
                linear-gradient(160deg, var(--c1) 0%, var(--c2) 42%, var(--c3) 100%);
            box-shadow:
                inset -4px -8px 14px rgba(30, 20, 90, .28),
                inset 3px 5px 10px rgba(255, 255, 255, .30),
                0 6px 18px var(--glow);
            animation: breathe 3.6s ease-in-out infinite;
        }

        .fairy[data-skin="stardust"] .ahoge {
            position: absolute;
            top: -13px;
            left: 50%;
            width: 4px;
            height: 16px;
            margin-left: -2px;
            background: linear-gradient(#a78bfa, #5b8cff);
            border-radius: 3px;
            transform-origin: bottom center;
            animation: sway 2.6s ease-in-out infinite;
        }

        .fairy[data-skin="stardust"] .ahoge::after {
            content: '';
            position: absolute;
            top: -7px;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff, #b9a5ff 55%, #7c5ade);
            box-shadow: 0 0 10px 2px rgba(167, 139, 250, .75);
        }

        .fairy[data-skin="stardust"] .eyes {
            top: 34px;
            gap: 18px;
        }

        .fairy[data-skin="stardust"] .eye {
            width: 15px;
            height: 18px;
        }

        .fairy[data-skin="stardust"] .eye::after {
            left: 4px;
            top: 6px;
            width: 7px;
            height: 8px;
        }

        .fairy[data-skin="stardust"] .eye::before {
            left: 6px;
            top: 7px;
            width: 3px;
            height: 3px;
        }

        .fairy[data-skin="stardust"] .cheek {
            top: 55px;
            width: 11px;
            height: 6px;
        }

        .fairy[data-skin="stardust"] .cheek.l {
            left: 14px;
        }

        .fairy[data-skin="stardust"] .cheek.r {
            right: 14px;
        }

        .fairy[data-skin="stardust"] .mouth {
            top: 56px;
            width: 12px;
            height: 6px;
            margin-left: -6px;
            border-radius: 0 0 12px 12px;
        }

        .fairy[data-skin="stardust"] .shadow {
            bottom: -9px;
            width: 62px;
            height: 12px;
            margin-left: -31px;
        }

        /* ============ 皮肤二：焰焰（火焰精灵，一束一束火舌簇） ============ */
        /* 仿经典火焰图标准作（twemoji/openmoji 🔥）：顶部多尖锯齿轮廓（中央主尖最高
           + 左右副尖 + 外侧矮尖，尖间深凹谷）+ 底部圆碗火盆 + 内焰同锯齿双层色；
           三束独立窜苗叠于尖上（相位错开）→ 头部呈「一束一束」窜动的火舌簇 */
        .fairy[data-skin="flame"] {
            --c1: #ffcf6e;
            --c1b: #ffe9a8;
            --c2: #ff9a3d;
            --c3: #ff5e4d;
            --glow: rgba(255, 138, 61, .45);
            --glow2: rgba(255, 190, 90, .75);
            --pupil: #4a2010;
            --blush: rgba(255, 90, 80, .55);
            --mouthc: #5c2418;
        }

        /* 外焰主体：5 尖锯齿头 + 圆碗底（clip-path 多边形，仿参考图火舌簇轮廓）；
           box-shadow 会被 clip-path 裁掉 → 用 filter: drop-shadow（光晕跟随锯齿形状） */
        .fairy[data-skin="flame"] .body {
            left: 8px;
            top: 0;
            width: 76px;
            height: 88px;
            background:
                radial-gradient(circle at 50% 30%, rgba(255, 250, 220, .5), transparent 42%),
                linear-gradient(178deg, #fff0b8 0%, #ffcf6e 24%, #ff9a3d 60%, #ff5e4d 100%);
            clip-path: polygon(
                    /* 左腰 → 顶部五尖锯齿 → 右腰（一束一束火舌） */
                    0% 70%,
                    5% 44%,
                    9% 26%,
                    15% 40%,
                    24% 14%,
                    34% 36%,
                    50% 0%,
                    66% 36%,
                    76% 14%,
                    85% 40%,
                    91% 26%,
                    95% 44%,
                    100% 70%,
                    /* 底部圆碗（折线近似弧，右 → 左） */
                    97% 82%,
                    90% 92%,
                    78% 98%,
                    62% 100%,
                    38% 100%,
                    22% 98%,
                    10% 92%,
                    3% 82%);
            filter: drop-shadow(0 5px 10px var(--glow));
            animation: flick1 1.1s ease-in-out infinite;
        }

        /* 内焰锯齿层：与外焰同款锯齿但更矮（双层锯齿色，仿参考图内焰黄舌） */
        .fairy[data-skin="flame"] .blaze {
            position: absolute;
            left: 18px;
            top: 24px;
            width: 56px;
            height: 50px;
            background: radial-gradient(circle at 50% 55%,
                    rgba(255, 243, 196, .95),
                    rgba(255, 204, 77, .75) 48%,
                    rgba(255, 150, 70, .25) 80%);
            clip-path: polygon(0% 58%,
                    8% 32%,
                    18% 50%,
                    32% 14%,
                    50% 48%,
                    68% 14%,
                    82% 50%,
                    92% 32%,
                    100% 58%,
                    96% 80%,
                    84% 93%,
                    64% 100%,
                    36% 100%,
                    16% 93%,
                    4% 80%);
            animation: flick2 .85s ease-in-out infinite;
            pointer-events: none;
        }

        /* 火芯亮核：头部中心偏下（锯齿头部的火焰心脏） */
        .fairy[data-skin="flame"] .core {
            position: absolute;
            left: 30px;
            top: 30px;
            width: 32px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%,
                    #fffbe6,
                    #ffe89a 50%,
                    rgba(255, 200, 90, 0) 76%);
            animation: flick3 .7s ease-in-out infinite;
            pointer-events: none;
        }

        /* 三束独立窜苗：根嵌锯齿尖内（先渲染压在 body 之下 → 无分离感），
           底部渐变透明与头顶亮色同值衔接；主苗居中，左右副苗错落相位各自窜动 */
        .fairy[data-skin="flame"] .tg {
            position: absolute;
            top: 2px;
            left: 50%;
            width: 12px;
            height: 24px;
            margin-left: -6px;
            background: linear-gradient(to top,
                    rgba(255, 207, 110, 0) 0%,
                    #ffcf6e 55%,
                    #fff3c4 100%);
            clip-path: polygon(50% 0%, 82% 30%, 68% 100%, 32% 100%, 18% 30%);
            transform-origin: bottom center;
            animation: tongueWag .8s ease-in-out infinite;
            filter: drop-shadow(0 0 4px rgba(255, 160, 60, .75));
        }

        .fairy[data-skin="flame"] .tg.tl {
            left: 22px;
            top: 8px;
            width: 9px;
            height: 17px;
            margin-left: 0;
            animation-duration: .95s;
            animation-delay: .22s;
        }

        .fairy[data-skin="flame"] .tg.tr {
            left: 61px;
            top: 5px;
            width: 9px;
            height: 19px;
            margin-left: 0;
            animation-duration: .72s;
            animation-delay: .45s;
        }

        /* 火星：从锯齿尖顶错时上飘 */
        .fairy[data-skin="flame"] .sparks {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .fairy[data-skin="flame"] .sparks i {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffd98a;
            box-shadow: 0 0 5px 1px rgba(255, 180, 90, .9);
            opacity: 0;
            animation: rise 1.7s linear infinite;
        }

        .fairy[data-skin="flame"] .sparks i:nth-child(1) {
            left: 44px;
            top: 0px;
        }

        .fairy[data-skin="flame"] .sparks i:nth-child(2) {
            left: 54px;
            top: 6px;
            animation-delay: .45s;
        }

        .fairy[data-skin="flame"] .sparks i:nth-child(3) {
            left: 34px;
            top: 5px;
            animation-delay: .9s;
        }

        .fairy[data-skin="flame"] .sparks i:nth-child(4) {
            left: 47px;
            top: -4px;
            animation-delay: 1.3s;
        }

        /* 脸置于火焰下半身（身体区） */
        .fairy[data-skin="flame"] .eyes {
            top: 52px;
            gap: 15px;
        }

        .fairy[data-skin="flame"] .eye {
            width: 14px;
            height: 17px;
        }

        .fairy[data-skin="flame"] .eye::after {
            left: 4px;
            top: 5px;
            width: 6px;
            height: 7px;
        }

        .fairy[data-skin="flame"] .eye::before {
            left: 5px;
            top: 6px;
            width: 3px;
            height: 3px;
        }

        .fairy[data-skin="flame"] .cheek {
            top: 69px;
            width: 10px;
            height: 5px;
        }

        .fairy[data-skin="flame"] .cheek.l {
            left: 15px;
        }

        .fairy[data-skin="flame"] .cheek.r {
            right: 15px;
        }

        .fairy[data-skin="flame"] .mouth {
            top: 70px;
            width: 11px;
            height: 6px;
            margin-left: -5.5px;
            border-radius: 0 0 11px 11px;
        }

        .fairy[data-skin="flame"] .shadow {
            bottom: -7px;
            width: 62px;
            height: 11px;
            margin-left: -31px;
        }

        /* ============ 皮肤三：泡泡（水母精灵） ============ */
        /* 半圆穹顶（伞缘收缩推进）+ 四条相位错开触须；触须先渲染顶端藏于伞下 */
        .fairy[data-skin="bubble"] {
            --c1: #9be8ff;
            --c1b: #d0f6ff;
            --c2: #5cc8f5;
            --c3: #3f9fe0;
            --glow: rgba(92, 200, 245, .4);
            --glow2: rgba(120, 220, 250, .65);
            --pupil: #1c3a5a;
            --blush: rgba(255, 150, 170, .45);
            --mouthc: #1e4a66;
        }

        .fairy[data-skin="bubble"] .body {
            left: 7px;
            top: 4px;
            width: 78px;
            height: 58px;
            border-radius: 48% 48% 42% 42% / 92% 92% 20% 20%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .75), transparent 46%),
                radial-gradient(circle at 70% 70%, rgba(63, 159, 224, .4), transparent 60%),
                linear-gradient(165deg, var(--c1) 0%, var(--c2) 52%, var(--c3) 100%);
            box-shadow:
                inset 0 -5px 8px rgba(255, 255, 255, .4),
                inset -3px -3px 8px rgba(60, 150, 200, .25),
                0 6px 16px var(--glow);
            animation: jet 2.8s ease-in-out infinite;
        }

        .fairy[data-skin="bubble"] .tent {
            position: absolute;
            top: 56px;
            left: 0;
            right: 0;
            height: 30px;
        }

        .fairy[data-skin="bubble"] .tent i {
            position: absolute;
            top: 0;
            width: 4px;
            height: 26px;
            border-radius: 4px;
            background: linear-gradient(rgba(155, 232, 255, .9), rgba(63, 159, 224, .15));
            transform-origin: top center;
            animation: tentSway 2.4s ease-in-out infinite;
        }

        .fairy[data-skin="bubble"] .tent i:nth-child(1) {
            left: 24px;
        }

        .fairy[data-skin="bubble"] .tent i:nth-child(2) {
            left: 36px;
            height: 30px;
            animation-delay: .3s;
        }

        .fairy[data-skin="bubble"] .tent i:nth-child(3) {
            left: 50px;
            height: 28px;
            animation-delay: .6s;
        }

        .fairy[data-skin="bubble"] .tent i:nth-child(4) {
            left: 62px;
            animation-delay: .9s;
        }

        .fairy[data-skin="bubble"] .eyes {
            top: 28px;
            gap: 15px;
        }

        .fairy[data-skin="bubble"] .eye {
            width: 14px;
            height: 16px;
        }

        .fairy[data-skin="bubble"] .eye::after {
            left: 4px;
            top: 5px;
            width: 6px;
            height: 7px;
        }

        .fairy[data-skin="bubble"] .eye::before {
            left: 5px;
            top: 6px;
            width: 3px;
            height: 3px;
        }

        .fairy[data-skin="bubble"] .cheek {
            top: 44px;
            width: 9px;
            height: 5px;
        }

        .fairy[data-skin="bubble"] .cheek.l {
            left: 12px;
        }

        .fairy[data-skin="bubble"] .cheek.r {
            right: 12px;
        }

        .fairy[data-skin="bubble"] .mouth {
            top: 45px;
            width: 10px;
            height: 5px;
            margin-left: -5px;
            border-radius: 0 0 10px 10px;
        }

        .fairy[data-skin="bubble"] .shadow {
            bottom: -5px;
            width: 56px;
            height: 10px;
            margin-left: -28px;
            opacity: .6;
        }

        /* ============ 皮肤四：苔苔（仙人掌精灵） ============ */
        /* 柱状带肋纹主干 + 双臂摆动 + 头顶三瓣小花；手臂先渲染根部藏于主干后 */
        .fairy[data-skin="moss"] {
            --c1: #b8e986;
            --c1b: #dcf5b8;
            --c2: #7ac74f;
            --c3: #4c9d5a;
            --glow: rgba(122, 199, 79, .35);
            --glow2: rgba(160, 220, 120, .6);
            --pupil: #1e3a22;
            --blush: rgba(255, 160, 140, .45);
            --mouthc: #2c4a2e;
        }

        .fairy[data-skin="moss"] .body {
            left: 24px;
            top: 12px;
            width: 44px;
            height: 80px;
            border-radius: 22px 22px 15px 15px / 30px 30px 12px 12px;
            background: linear-gradient(175deg, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
            box-shadow:
                inset -5px -6px 10px rgba(20, 70, 25, .3),
                inset 4px 5px 9px rgba(255, 255, 255, .35),
                0 6px 14px var(--glow);
            animation: breathe 3.6s ease-in-out infinite;
        }

        .fairy[data-skin="moss"] .body::after {
            /* 肋纹 */
            content: '';
            position: absolute;
            inset: 6px 8px;
            border-radius: inherit;
            background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(20, 70, 25, .14) 9px 12px);
            pointer-events: none;
        }

        .fairy[data-skin="moss"] .arm-l,
        .fairy[data-skin="moss"] .arm-r {
            position: absolute;
            top: 36px;
            width: 15px;
            height: 30px;
            background: linear-gradient(175deg, var(--c1), var(--c2) 70%);
            border-radius: 8px 8px 6px 6px / 10px 10px 6px 6px;
            box-shadow:
                inset -3px -4px 7px rgba(20, 70, 25, .28),
                inset 2px 3px 6px rgba(255, 255, 255, .3);
            transform-origin: bottom center;
        }

        .fairy[data-skin="moss"] .arm-l {
            left: 6px;
            transform: rotate(-10deg);
            animation: armSwayL 3.4s ease-in-out infinite;
        }

        .fairy[data-skin="moss"] .arm-r {
            right: 6px;
            transform: rotate(10deg);
            animation: armSwayR 3.4s ease-in-out infinite;
        }

        .fairy[data-skin="moss"] .flower {
            position: absolute;
            top: -6px;
            left: 50%;
            width: 26px;
            height: 18px;
            margin-left: -13px;
            z-index: 2;
        }

        .fairy[data-skin="moss"] .flower i {
            position: absolute;
            top: 2px;
            width: 11px;
            height: 9px;
            background: linear-gradient(#ffd9e8, #ff9ec7);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 5px rgba(255, 158, 199, .6);
        }

        .fairy[data-skin="moss"] .flower i:nth-child(1) {
            left: 0;
            transform: rotate(-30deg);
        }

        .fairy[data-skin="moss"] .flower i:nth-child(2) {
            left: 7.5px;
            top: 0;
        }

        .fairy[data-skin="moss"] .flower i:nth-child(3) {
            left: 15px;
            transform: rotate(30deg);
        }

        .fairy[data-skin="moss"] .flower b {
            position: absolute;
            left: 10px;
            top: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff7cf, #ffd24d);
            box-shadow: 0 0 6px rgba(255, 210, 80, .8);
        }

        .fairy[data-skin="moss"] .eyes {
            top: 42px;
            gap: 10px;
        }

        .fairy[data-skin="moss"] .eye {
            width: 12px;
            height: 14px;
        }

        .fairy[data-skin="moss"] .eye::after {
            left: 3.5px;
            top: 4px;
            width: 5px;
            height: 6px;
        }

        .fairy[data-skin="moss"] .eye::before {
            left: 5px;
            top: 5px;
            width: 2.5px;
            height: 2.5px;
        }

        .fairy[data-skin="moss"] .cheek {
            top: 58px;
            width: 8px;
            height: 4px;
        }

        .fairy[data-skin="moss"] .cheek.l {
            left: 28px;
        }

        .fairy[data-skin="moss"] .cheek.r {
            right: 28px;
        }

        .fairy[data-skin="moss"] .mouth {
            top: 59px;
            width: 9px;
            height: 5px;
            margin-left: -4.5px;
            border-radius: 0 0 9px 9px;
        }

        .fairy[data-skin="moss"] .shadow {
            bottom: -7px;
            width: 50px;
            height: 10px;
            margin-left: -25px;
        }

        /* ============ 皮肤五：墨墨（猫精灵） ============ */
        /* 圆脸+三角猫耳（内耳粉）+ 竖瞳 + ω 嘴 + 胡须 + 摇尾 + 星光点缀；
           耳/尾先渲染根部藏于脸后；ω 嘴为透明容器+双弧伪元素 */
        .fairy[data-skin="ink"] {
            --c1: #6b6b8f;
            --c1b: #9a9ac8;
            --c2: #3a3a5c;
            --c3: #23233c;
            --glow: rgba(130, 110, 220, .35);
            --glow2: rgba(160, 140, 255, .6);
            --pupil: #16122b;
            --blush: rgba(180, 120, 200, .35);
            --mouthc: #191530;
        }

        .fairy[data-skin="ink"] .body {
            left: 10px;
            top: 14px;
            width: 72px;
            height: 78px;
            border-radius: 48% 48% 45% 45%;
            background:
                radial-gradient(circle at 34% 26%, rgba(255, 255, 255, .5), transparent 40%),
                radial-gradient(circle at 66% 76%, rgba(130, 110, 220, .35), transparent 55%),
                linear-gradient(160deg, var(--c1) 0%, var(--c2) 48%, var(--c3) 100%);
            box-shadow:
                inset -4px -8px 14px rgba(5, 5, 20, .5),
                inset 3px 5px 10px rgba(255, 255, 255, .22),
                0 6px 16px var(--glow);
            animation: breathe 3.6s ease-in-out infinite;
        }

        .fairy[data-skin="ink"] .body::before {
            /* 星光点缀 */
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background:
                radial-gradient(circle at 44% 58%, rgba(220, 205, 255, .5) 0 1.5px, transparent 2.5px),
                radial-gradient(circle at 60% 34%, rgba(220, 205, 255, .35) 0 1px, transparent 2px),
                radial-gradient(circle at 36% 70%, rgba(220, 205, 255, .3) 0 1px, transparent 2px),
                radial-gradient(circle at 54% 18%, rgba(220, 205, 255, .4) 0 1px, transparent 2px);
        }

        .fairy[data-skin="ink"] .ear-l,
        .fairy[data-skin="ink"] .ear-r {
            position: absolute;
            top: -2px;
            width: 26px;
            height: 24px;
            background: linear-gradient(165deg, var(--c1), var(--c2));
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            transform-origin: bottom center;
        }

        .fairy[data-skin="ink"] .ear-l {
            left: 13px;
            transform: rotate(-8deg);
        }

        .fairy[data-skin="ink"] .ear-r {
            right: 13px;
            transform: rotate(8deg);
        }

        .fairy[data-skin="ink"] .ear-l::after,
        .fairy[data-skin="ink"] .ear-r::after {
            /* 内耳 */
            content: '';
            position: absolute;
            left: 6px;
            top: 9px;
            width: 14px;
            height: 12px;
            background: rgba(255, 150, 170, .45);
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        /* 尾巴：单条 SVG 贝塞尔曲线细弯猫尾——根点(12,80)埋在身体内部右后（被 body
           压住 → 无缝连接），先向右弧出身体外再向左上弯回（自然 S 弯不笔直），
           stroke 描边 7px 细长、linecap 圆头收尾（无末端多余图形）；
           渐变根暗 var(--c3) → 梢亮 var(--c1)；围绕根点小幅摆动（tailWag） */
        .fairy[data-skin="ink"] .tail {
            position: absolute;
            right: -14px;
            bottom: 6px;
            width: 44px;
            height: 84px;
            display: block;
            overflow: visible;
            transform-origin: 12px 80px;
            /* 根点（元素盒内坐标）：摆动围绕尾巴根而非盒中心，摆幅自然 */
            animation: tailWag 2.2s ease-in-out infinite;
        }

        .fairy[data-skin="ink"] .eyes {
            top: 38px;
            gap: 16px;
        }

        .fairy[data-skin="ink"] .eye {
            width: 14px;
            height: 16px;
        }

        .fairy[data-skin="ink"] .eye::after {
            /* 竖瞳（猫眼） */
            left: 4.5px;
            top: 2.5px;
            width: 5px;
            height: 11px;
        }

        .fairy[data-skin="ink"] .eye::before {
            left: 5.5px;
            top: 4px;
            width: 2px;
            height: 2px;
        }

        .fairy[data-skin="ink"] .cheek {
            top: 58px;
            width: 9px;
            height: 5px;
        }

        .fairy[data-skin="ink"] .cheek.l {
            left: 12px;
        }

        .fairy[data-skin="ink"] .cheek.r {
            right: 12px;
        }

        .fairy[data-skin="ink"] .mouth {
            /* ω 猫嘴：透明容器 + 双弧伪元素 */
            top: 57px;
            width: 18px;
            height: 7px;
            margin-left: -9px;
            background: transparent;
        }

        .fairy[data-skin="ink"] .mouth::before,
        .fairy[data-skin="ink"] .mouth::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 6px;
            border-radius: 0 0 8px 8px;
            background: var(--mouthc);
            transition: all .25s;
        }

        .fairy[data-skin="ink"] .mouth::before {
            left: 1px;
        }

        .fairy[data-skin="ink"] .mouth::after {
            right: 1px;
        }

        .fairy[data-skin="ink"] .whiskers {
            position: absolute;
            top: 52px;
            width: 13px;
            height: 10px;
            pointer-events: none;
        }

        .fairy[data-skin="ink"] .whiskers::before,
        .fairy[data-skin="ink"] .whiskers::after {
            content: '';
            position: absolute;
            width: 13px;
            height: 2px;
            border-radius: 2px;
            background: rgba(205, 200, 235, .5);
        }

        .fairy[data-skin="ink"] .whiskers::before {
            top: 0;
        }

        .fairy[data-skin="ink"] .whiskers::after {
            top: 5px;
        }

        .fairy[data-skin="ink"] .whiskers.w-l {
            left: 0;
            transform: rotate(6deg);
        }

        .fairy[data-skin="ink"] .whiskers.w-r {
            right: 0;
            transform: rotate(-6deg);
        }

        .fairy[data-skin="ink"] .shadow {
            bottom: -7px;
            width: 64px;
            height: 11px;
            margin-left: -32px;
        }

        /* ============ 状态（全皮肤通用；置于皮肤段之后确保覆盖形态默认） ============ */
        .fairy.running {
            animation: bounce .62s cubic-bezier(.5, 0, .5, 1) infinite;
        }

        .fairy.running .body {
            background:
                radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .65), transparent 40%),
                radial-gradient(circle at 68% 74%, rgba(124, 88, 222, .5), transparent 52%),
                linear-gradient(160deg, var(--c1b) 0%, var(--c2) 40%, var(--c3) 100%);
            box-shadow:
                inset -4px -8px 14px rgba(30, 20, 90, .28),
                inset 3px 5px 10px rgba(255, 255, 255, .35),
                0 0 18px 4px var(--glow2),
                0 0 40px 10px var(--glow);
            animation: breathe 1.6s ease-in-out infinite;
        }

        .fairy.running .mouth {
            width: 16px;
            height: 10px;
            margin-left: -8px;
            border-radius: 0 0 16px 16px;
            background: #5a2f57;
        }

        .fairy.running .ahoge {
            animation: sway .5s ease-in-out infinite;
        }

        .fairy.running .shadow {
            animation: shadowBounce .62s cubic-bezier(.5, 0, .5, 1) infinite;
        }

        .fairy.error {
            filter: grayscale(.9) brightness(.82);
            animation: floaty 4.5s ease-in-out infinite;
        }

        .fairy.error .body {
            animation: none;
        }

        .fairy.error .eye {
            animation: blink 7s infinite;
        }

        .fairy.error .mouth {
            border-radius: 12px 12px 0 0;
            height: 4px;
        }

        .fairy.dragging {
            opacity: .82;
        }

        /* ============ 皮肤专属状态细节（特异性更高，覆盖通用状态规则） ============ */
        /* 焰焰：三层颤动全部加速 + 外焰增亮 + 窜苗快窜 + 火星密集快升；
           注意 .body 的 flick1 必须在此夺回（通用 running 规则会把 animation 覆盖成 breathe）；
           clip-path 下 box-shadow 无效 → 发光用双层 filter: drop-shadow（跟随锯齿轮廓） */
        .fairy[data-skin="flame"].running .body {
            animation: flick1 .55s ease-in-out infinite;
            background:
                radial-gradient(circle at 50% 30%, rgba(255, 252, 230, .68), transparent 42%),
                linear-gradient(178deg, #fff6cf 0%, #ffdd8a 24%, #ffb35c 60%, #ff7a52 100%);
            filter:
                drop-shadow(0 0 14px var(--glow2)) drop-shadow(0 0 30px var(--glow));
        }

        .fairy[data-skin="flame"].running .blaze {
            animation-duration: .42s;
        }

        .fairy[data-skin="flame"].running .core {
            animation-duration: .34s;
        }

        .fairy[data-skin="flame"].running .tg {
            animation-duration: .35s;
        }

        .fairy[data-skin="flame"].running .sparks i {
            animation-duration: .55s;
        }

        /* 焰焰异常：颤动极慢 + 内焰半透明度降（将熄感），灰度由通用 filter 处理 */
        .fairy[data-skin="flame"].error .body {
            animation: flick1 3.5s ease-in-out infinite;
        }

        .fairy[data-skin="flame"].error .blaze {
            animation-duration: 3s;
            opacity: .55;
        }

        .fairy[data-skin="flame"].error .core {
            animation-duration: 2.6s;
        }

        .fairy[data-skin="flame"].error .tg {
            animation-duration: 3s;
        }

        .fairy[data-skin="flame"].error .sparks i {
            animation-duration: 4s;
        }

        /* 泡泡：伞缘快收缩 + 触须快摆；异常触须慢漂 */
        .fairy[data-skin="bubble"].running .body {
            animation: jet 1s ease-in-out infinite;
        }

        .fairy[data-skin="bubble"].running .tent i {
            animation-duration: .7s;
        }

        .fairy[data-skin="bubble"].error .tent i {
            animation-duration: 4.5s;
        }

        /* 苔苔：花朵闪烁 + 双臂快晃 */
        .fairy[data-skin="moss"].running .flower i {
            animation: twinkle .55s ease-in-out infinite;
        }

        .fairy[data-skin="moss"].running .arm-l {
            animation: armSwayL .5s ease-in-out infinite;
        }

        .fairy[data-skin="moss"].running .arm-r {
            animation: armSwayR .5s ease-in-out infinite;
        }

        /* 墨墨：尾巴快摇 + 耳朵抖动 + ω 大笑（容器必须压回透明，防通用规则灌色） */
        .fairy[data-skin="ink"].running .tail {
            animation: tailWag .3s ease-in-out infinite;
        }

        .fairy[data-skin="ink"].running .ear-l {
            animation: earWiggleL .6s ease-in-out infinite;
        }

        .fairy[data-skin="ink"].running .ear-r {
            animation: earWiggleR .6s ease-in-out infinite;
        }

        .fairy[data-skin="ink"].running .mouth {
            background: transparent;
            width: 22px;
            height: 8px;
            margin-left: -11px;
        }

        .fairy[data-skin="ink"].running .mouth::before {
            width: 10px;
            height: 8px;
            left: 1px;
        }

        .fairy[data-skin="ink"].running .mouth::after {
            width: 10px;
            height: 8px;
            right: 1px;
        }

        /* 墨墨异常：耳朵耷拉 + ω 弧反转委屈 + 尾巴慢摆 */
        .fairy[data-skin="ink"].error .ear-l {
            transform: rotate(-32deg);
        }

        .fairy[data-skin="ink"].error .ear-r {
            transform: rotate(32deg);
        }

        .fairy[data-skin="ink"].error .tail {
            animation-duration: 4.5s;
        }

        .fairy[data-skin="ink"].error .mouth {
            height: 7px;
        }

        .fairy[data-skin="ink"].error .mouth::before,
        .fairy[data-skin="ink"].error .mouth::after {
            border-radius: 8px 8px 0 0;
            height: 4px;
            bottom: 1px;
        }

        /* 运行徽标 */
        .badge {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            display: none;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            background: #0f1626;
            border: 1px solid rgba(91, 140, 255, .4);
            color: #cfe0ff;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity .3s, transform .3s;
            z-index: 3;
        }

        .badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6ef0a8;
            box-shadow: 0 0 6px #6ef0a8;
            animation: dotPulse 1.2s ease-in-out infinite;
        }

        .badge.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        @keyframes floaty {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.035);
            }
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-9deg);
            }

            50% {
                transform: rotate(9deg);
            }
        }

        @keyframes blink {

            0%,
            94%,
            100% {
                transform: scaleY(1);
            }

            96%,
            98% {
                transform: scaleY(.08);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(.82);
            }
        }

        /* 焰焰三层错频颤动（不规则多帧，模拟火焰随机翻腾） */
        @keyframes flick1 {

            0%,
            100% {
                transform: scale(1, 1);
            }

            25% {
                transform: scale(1.045, .965);
            }

            50% {
                transform: scale(.965, 1.05);
            }

            75% {
                transform: scale(1.02, .99);
            }
        }

        @keyframes flick2 {

            0%,
            100% {
                transform: scale(1) translateY(0);
                opacity: .95;
            }

            30% {
                transform: scale(1.07) translateY(-1px);
                opacity: 1;
            }

            60% {
                transform: scale(.93) translateY(1px);
                opacity: .82;
            }
        }

        @keyframes flick3 {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            40% {
                transform: scale(1.16);
                opacity: .88;
            }

            70% {
                transform: scale(.88);
                opacity: 1;
            }
        }

        /* 焰焰火苗窜动摇曳（伸缩+倾斜，非匀速） */
        @keyframes tongueWag {

            0%,
            100% {
                transform: scaleY(1) skewX(0deg);
            }

            20% {
                transform: scaleY(1.14) skewX(5deg);
            }

            45% {
                transform: scaleY(.84) skewX(-6deg);
            }

            70% {
                transform: scaleY(1.08) skewX(3deg);
            }
        }

        /* 焰焰火星上飘 */
        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            15% {
                opacity: .9;
            }

            100% {
                transform: translateY(-24px) scale(.3);
                opacity: 0;
            }
        }

        /* 泡泡伞缘收缩推进（横向收纵向伸） */
        @keyframes jet {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(.94, 1.05);
            }
        }

        /* 泡泡触须摆动 */
        @keyframes tentSway {

            0%,
            100% {
                transform: rotate(-11deg);
            }

            50% {
                transform: rotate(11deg);
            }
        }

        /* 苔苔双臂摆动（含基础倾角） */
        @keyframes armSwayL {

            0%,
            100% {
                transform: rotate(-13deg);
            }

            50% {
                transform: rotate(-6deg);
            }
        }

        @keyframes armSwayR {

            0%,
            100% {
                transform: rotate(13deg);
            }

            50% {
                transform: rotate(6deg);
            }
        }

        /* 墨墨细尾摇摆（竖直小幅度左右摆，3deg ↔ -5deg） */
        @keyframes tailWag {

            0%,
            100% {
                transform: rotate(3deg);
            }

            50% {
                transform: rotate(-5deg);
            }
        }

        /* 墨墨耳朵抖动（含基础倾角） */
        @keyframes earWiggleL {

            0%,
            100% {
                transform: rotate(-8deg);
            }

            50% {
                transform: rotate(-16deg);
            }
        }

        @keyframes earWiggleR {

            0%,
            100% {
                transform: rotate(8deg);
            }

            50% {
                transform: rotate(16deg);
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) scale(1, 1);
            }

            22% {
                transform: translateY(-16px) scale(.96, 1.05);
            }

            42% {
                transform: translateY(0) scale(1.06, .93);
            }

            58% {
                transform: translateY(-7px) scale(.99, 1.02);
            }

            74% {
                transform: translateY(0) scale(1.03, .97);
            }
        }

        @keyframes shadowPulse {

            0%,
            100% {
                transform: scaleX(1);
                opacity: .8;
            }

            50% {
                transform: scaleX(.86);
                opacity: .55;
            }
        }

        @keyframes shadowBounce {

            0%,
            100% {
                transform: scaleX(1);
                opacity: .8;
            }

            22% {
                transform: scaleX(.66);
                opacity: .4;
            }

            42% {
                transform: scaleX(1.12);
                opacity: .85;
            }

            58% {
                transform: scaleX(.86);
                opacity: .6;
            }
        }

        @keyframes dotPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }


        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: translate(-50%, 0) scale(.5);
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -34px) scale(1.25);
            }
        }
    </style>
</head>

    <script>
        (function () {
            const fairy = document.getElementById('fairy')
            const wrap = document.getElementById('wrap')
            const badge = document.getElementById('badge')
            const badgeText = document.getElementById('badgeText')
            let spark = document.getElementById('spark')
            const ea = window.electronAPI || {}
            const fairyAPI = ea.fairy || {}
            const API = (ea.apiBase || '') + '/api/ext/fairy_ball'

            // —— 皮肤与大小数据（独立菜单窗与球窗同源共享 localStorage）——
            const SKINS = [
                { id: 'stardust', name: '星尘', icon: '🧚', spark: '✨' },
                { id: 'flame', name: '焰焰', icon: '🔥', spark: '🔥' },
                { id: 'bubble', name: '泡泡', icon: '🐙', spark: '🫧' },
                { id: 'moss', name: '苔苔', icon: '🌵', spark: '🌸' },
                { id: 'ink', name: '墨墨', icon: '🐈', spark: '⭐' },
            ]
            const SIZES = [
                { id: 's', name: '小' },
                { id: 'm', name: '中' },
                { id: 'l', name: '大' },
            ]

            // —— 五款形态模板：结构完全独立（圆球/火苗/水母/仙人掌/猫），
            //    公共类名（body/eyes/eye/cheek/mouth/shadow/spark）保留以复用三态动画与眨眼 ——
            const SKIN_TPL = {
                stardust: `
                    <div class="ahoge"></div>
                    <div class="body"></div>
                    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                    <div class="cheek l"></div><div class="cheek r"></div>
                    <div class="mouth"></div>
                    <div class="shadow"></div>
                    <div class="spark" id="spark">✨</div>`,
                flame: `

                    <div class="tg tl"></div>
                    <div class="tg tr"></div>
                    <div class="tg"></div>
                    <div class="body"></div>
                    <div class="blaze"></div>
                    <div class="core"></div>
                    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                    <div class="cheek l"></div><div class="cheek r"></div>
                    <div class="mouth"></div>
                    <div class="sparks"><i></i><i></i><i></i><i></i></div>
                    <div class="shadow"></div>
                    <div class="spark" id="spark">🔥</div>`,
                bubble: `
                    <div class="tent"><i></i><i></i><i></i><i></i></div>
                    <div class="body"></div>
                    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                    <div class="cheek l"></div><div class="cheek r"></div>
                    <div class="mouth"></div>
                    <div class="shadow"></div>
                    <div class="spark" id="spark">🫧</div>`,
                moss: `
                    <div class="arm-l"></div><div class="arm-r"></div>
                    <div class="body"></div>
                    <div class="flower"><i></i><i></i><i></i><b></b></div>
                    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                    <div class="cheek l"></div><div class="cheek r"></div>
                    <div class="mouth"></div>
                    <div class="shadow"></div>
                    <div class="spark" id="spark">🌸</div>`,
                ink: `
                    <div class="ear-l"></div><div class="ear-r"></div>
                    <svg class="tail" viewBox="0 0 44 84" aria-hidden="true">
                        <defs>
                            <linearGradient id="inkTailG" x1="0" y1="1" x2="0" y2="0">
                                <stop offset="0" style="stop-color:var(--c3)"></stop>
                                <stop offset=".55" style="stop-color:var(--c2)"></stop>
                                <stop offset="1" style="stop-color:var(--c1)"></stop>
                            </linearGradient>
                        </defs>
                        <path d="M12 80 C26 74 36 58 34 40 C32 22 24 10 10 6" fill="none"
                            stroke="url(#inkTailG)" stroke-width="7" stroke-linecap="round"></path>
                    </svg>
                    <div class="body"></div>
                    <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                    <div class="whiskers w-l"></div><div class="whiskers w-r"></div>
                    <div class="cheek l"></div><div class="cheek r"></div>
                    <div class="mouth"></div>
                    <div class="shadow"></div>
                    <div class="spark" id="spark">⭐</div>`,
            }

            let curSkin = SKINS[0]
            let curSize = SIZES[1]
            // 状态跟踪（提前声明：applySkin 初始化即调 refreshTitle 读取）
            let curStatus = 'idle'
            let runningNames = []

            // —— 应用外观（换模板 + localStorage 记忆）——
            function applySkin(s) {
                curSkin = s
                fairy.dataset.skin = s.id
                fairy.innerHTML = SKIN_TPL[s.id] || SKIN_TPL.stardust
                spark = document.getElementById('spark')   // 模板重注入后重取引用
                if (spark) spark.textContent = s.spark
                try { localStorage.setItem('fairy.skin', s.id) } catch (e) { }
                refreshTitle()
            }
            function applySize(z) {
                curSize = z
                wrap.dataset.size = z.id
                try { localStorage.setItem('fairy.size', z.id) } catch (e) { }
            }
            function refreshTitle() {
                if (curStatus === 'running') {
                    const names = (runningNames || []).join('、')
                    fairy.title = curSkin.name + ' · 智能体集群 · 运行中' + (names ? '：' + names : '')
                } else if (curStatus === 'error') {
                    fairy.title = curSkin.name + ' · 智能体集群 · 后端连接异常'
                } else {
                    fairy.title = curSkin.name + ' · 智能体集群 · 点击打开'
                }
            }

            // 初始化：localStorage 恢复上次选择
            try {
                const s = SKINS.find(k => k.id === localStorage.getItem('fairy.skin'))
                if (s) applySkin(s)
                const z = SIZES.find(k => k.id === localStorage.getItem('fairy.size'))
                if (z) applySize(z)
            } catch (e) { }

            // —— 命中测试穿透：精灵可见部分不穿透，周围空白穿透给下层窗口 ——
            // 方案：setIgnoreMouseEvents(true,{forward:true})——穿透期间 mousemove 仍派发到本页，
            // 据此做 elementFromPoint 实时命中测试；rAF 循环每帧重判，补偿精灵动画位移
            // （bounce/floaty 移动后无需等下一次 mousemove 即翻转穿透状态）。
            // 之前 mouseenter/mouseleave 悬停合成方案的时序竞态由此根除。
            let passthrough = true
            let lastMouse = null
            function setPassthrough(v) {
                if (v === passthrough) return
                passthrough = v
                try { fairyAPI.setIgnoreMouse && fairyAPI.setIgnoreMouse(v) } catch (e) { }
            }
            function hitTest(x, y) {
                // 按住拖动中 → 整窗接收（拖动事件流不能断；菜单已在独立窗，点外部由捕获层关闭）
                if (press) return false
                // 徽标可见区 → 接收
                const el = document.elementFromPoint(x, y)
                if (el && el.closest('#badge')) return false
                // 精灵可见部分 = 主体圆形（getBoundingClientRect 已含动画 transform 与大小档位缩放）；
                // 容器四角视觉透明 → 按圆心距离判定为空白穿透
                const r = fairy.getBoundingClientRect()
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2
                const dx = x - cx, dy = y - cy
                const RAD = r.width / 2 + 2   // 半径随缩放档位实时变化
                return dx * dx + dy * dy > RAD * RAD
            }
            function refreshHit() {
                if (lastMouse != null) setPassthrough(hitTest(lastMouse.x, lastMouse.y))
            }

            // —— 眼部跟随：鼠标靠近精灵时瞳孔看向鼠标方向 ——
            // 眼睛中心用 .eyes 容器实时矩形取（各皮肤 eyes 位置不同、bounce/floaty 动画
            // 位移与大小档位缩放均被 getBoundingClientRect 天然包含）；感知半径内越近
            // 偏移越大，超半径归零；lerp 平滑防抖。穿透期间 forward 仍派发 mousemove，
            // 鼠标从旁边扫过也能跟随（lastMouse 由 capture mousemove 持续更新）。
            let lkX = 0, lkY = 0
            function updateEyeFollow() {
                const eyesEl = fairy.querySelector('.eyes')
                if (!eyesEl) return
                let tx = 0, ty = 0
                if (lastMouse != null) {
                    const r = eyesEl.getBoundingClientRect()
                    const cx = r.left + r.width / 2, cy = r.top + r.height / 2
                    const dx = lastMouse.x - cx, dy = lastMouse.y - cy
                    const dist = Math.hypot(dx, dy)
                    const MAXD = 170, AMP = 2.2   // 感知半径(px) / 最大瞳孔偏移(px)
                    if (dist > 1 && dist < MAXD) {
                        // 近端 40% 内满幅，远端线性衰减到 0
                        const k = AMP * Math.min(1, (MAXD - dist) / (MAXD * .4))
                        tx = dx / dist * k
                        ty = dy / dist * k
                    }
                }
                lkX += (tx - lkX) * .18
                lkY += (ty - lkY) * .18
                fairy.style.setProperty('--lk-x', lkX.toFixed(2) + 'px')
                fairy.style.setProperty('--lk-y', lkY.toFixed(2) + 'px')
            }
            window.addEventListener('mousemove', (e) => {
                lastMouse = { x: e.clientX, y: e.clientY }
                refreshHit()
            }, true)
                ; (function pollHit() {
                    refreshHit()
                    updateEyeFollow()
                    requestAnimationFrame(pollHit)
                })()
            setPassthrough(true)   // 初始穿透（窗口大部分是空白）


            // —— 拖动 vs 点击（位移 > 4px 判定为拖动窗口）——
            let press = null
            fairy.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return
                press = { sx: e.screenX, sy: e.screenY, wx: null, wy: null, moved: false }
                Promise.resolve(fairyAPI.winPos ? fairyAPI.winPos() : null).then((p) => {
                    if (press && !press.moved && p) { press.wx = p.x, press.wy = p.y }
                })
            })
            window.addEventListener('mousemove', (e) => {
                if (!press) return
                const dx = e.screenX - press.sx, dy = e.screenY - press.sy
                if (!press.moved && Math.abs(dx) + Math.abs(dy) > 4) {
                    press.moved = true
                    fairy.classList.add('dragging')
                }
                if (press.moved && press.wx != null) {
                    fairyAPI.moveTo && fairyAPI.moveTo(press.wx + dx, press.wy + dy)
                }
            })
            window.addEventListener('mouseup', () => {
                if (!press) return
                const wasDrag = press.moved
                press = null
                fairy.classList.remove('dragging')
                if (wasDrag) { return }
                // 点击 → 惊喜动画 + 打开主窗口
                if (spark) { spark.classList.remove('go'); void spark.offsetWidth; spark.classList.add('go') }
                fairyAPI.openMain && fairyAPI.openMain()
            })

            // —— 右键菜单：独立置顶小窗（主进程按屏幕工作区钳制定位防出界、失焦自动收起）——
            // 精灵/徽标上右键弹出；空白区域已穿透，右键归下层窗口
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault()
                fairyAPI.openMenu && fairyAPI.openMenu(e.screenX, e.screenY)
            })

            // —— 换装同步：独立菜单窗写 localStorage → storage 事件跨窗感知（同源）即时换装 ——
            window.addEventListener('storage', (e) => {
                if (e.key === 'fairy.skin') {
                    const s = SKINS.find(k => k.id === e.newValue)
                    if (s && s.id !== curSkin.id) applySkin(s)
                } else if (e.key === 'fairy.size') {
                    const z = SIZES.find(k => k.id === e.newValue)
                    if (z && z.id !== curSize.id) applySize(z)
                }
            })

            // —— 状态轮询：idle / running / error ——
            async function poll() {
                try {
                    const res = await fetch(API + '/state', { signal: AbortSignal.timeout(2500) })
                    if (!res.ok) throw new Error('http ' + res.status)
                    const data = await res.json()
                    setStatus(data.status || 'idle', data.running || [])
                } catch (e) {
                    setStatus('error', [])
                }
            }
            function setStatus(st, running) {
                if (st !== curStatus) {
                    fairy.classList.remove('running', 'error')
                    if (st === 'running') fairy.classList.add('running')
                    if (st === 'error') fairy.classList.add('error')
                    curStatus = st
                }
                if (st === 'running' && running.length) {
                    runningNames = running.map((r) => r.agent_name || ('#' + r.agent_id))
                    const names = runningNames.join('、')
                    badgeText.textContent = running.length > 1 ? (running.length + ' 个智能体运行中') : (names + ' 运行中')
                    badge.classList.add('show')
                    refreshTitle()
                } else {
                    runningNames = []
                    badge.classList.remove('show')
                    refreshTitle()
                }
            }
            poll()
            setInterval(poll, 3000)
        })()
    </script>
</body>
