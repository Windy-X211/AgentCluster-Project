# send_email 插件 — 邮箱全功能管理（发送/读取/清理/整理/监听）
version: "0.3.0"
type: "plugin"
name: "send_email"
label:
  zh_Hans: "邮箱管理"
  en_US: "Mail Manager"
author: "AgentCluster"
description:
  zh_Hans: "邮箱全功能管理插件。核心能力：1.发送(send)支持纯文本/HTML/附件/抄送/密送；2.读取(list/read/search/folders)IMAP收件支持分页搜索附件下载；3.清理(delete/clean)删除批量清空垃圾箱；4.整理(move/mark/organize)移动标记已读重要按规则分类归档；5.监听(listen_wait)同步阻塞等待新邮件，记录开始时已有邮件只返回监听期间新到的邮件，带超时和剩余时间。内置QQ/163/Gmail/Outlook/企业邮箱预设。"
  en_US: "Full-featured mail manager: send, read, clean, organize, and sync-listen for new mails."
version_code: 3
icon: "📧"
tags: ["email", "smtp", "imap", "notification", "mail"]
