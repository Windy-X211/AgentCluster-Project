<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 150px;
            background: #14141f;
            color: #d7dbe7;
            font-family: system-ui, sans-serif;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 300px;
            height: 150px;
        }

        .chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            display: flex;
            gap: 6px;
            max-width: 82%;
            min-width: 0;
        }

        .msg.assistant.turn+.msg.assistant.turn {
            margin-top: 6px;
        }

        .msg.assistant {
            align-self: flex-start;
            flex-direction: row;
        }

        .msg.assistant .bubble {
            background: #262636;
            border-top-left-radius: 4px;
        }

        .msg.assistant.right {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg.assistant.right .col-wrap {
            align-items: flex-end;
        }

        .msg.assistant.right .bubble {
            border-top-left-radius: 8px;
            border-top-right-radius: 4px;
            align-self: flex-end;
            max-width: 100%;
        }

        .col-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 0;
        }

        .head-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            position: relative;
            overflow: hidden;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            color: #fff;
            background: #a855f7;
        }

        .who-assistant {
            font-size: 11.5px;
            color: rgba(215, 219, 231, .75);
            line-height: 1;
        }

        .turn-elapsed {
            font-size: 10px;
            color: rgba(215, 219, 231, .4);
            line-height: 1.2;
            margin-left: 4px;
            align-self: center;
            white-space: nowrap;
        }

        .proc-toggle {
            margin-left: 3px;
            padding: 0;
            border: none;
            background: none;
            font-size: 9.5px;
            line-height: 1;
            color: rgba(215, 219, 231, .42);
        }

        .bubble {
            padding: 9px 13px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, .08);
            position: relative;
            width: fit-content;
            max-width: 100%;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .bubble.markdown {
            white-space: normal;
        }

        .promoted-bubble {
            background: #262636;
        }
    </style>
</head>

<body>
    <div class="right-panel">
        <div class="chat-pane">
            <div class="chat-box" id="chatbox">
                <div class="msg assistant turn right" id="segB">
                    <div class="avatar" id="avB">总</div>
                    <div class="col-wrap">
                        <div class="head-row">
                            <div class="who-assistant">总经理</div>
                        </div>
                        <div class="a2a-plain-wrap" id="plainWrap">
                            <div class="bubble markdown" id="bubbleB">
                                请说明你的职责范围，包括当前负责的具体任务、技术栈定位以及在《新FPS游戏》项目中的分工边界。收到请回复。</div>
                        </div>
                    </div>
                </div>
                <div class="msg assistant turn" id="segA">
                    <div class="avatar" id="avA">开</div>
                    <div class="col-wrap">
                        <div class="head-row">
                            <div class="who-assistant">开发工程师</div>
                            <span class="turn-elapsed">17s</span>
                            <span class="proc-toggle">(&gt;过程)</span>
                        </div>
                        <div class="bubble markdown promoted-bubble" id="bubbleA">
                            职责说明已收录并记录，确认要点：你负责编码实现与自测。已完成与总经理的要点同步沟通。当前任务优先级：M2。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        window.__probe = function () {
            const ids = ['chatbox', 'segB', 'avB', 'plainWrap', 'bubbleB', 'segA', 'avA', 'bubbleA'];
            const out = { scroll: { scrollH: document.getElementById('chatbox').scrollHeight, clientH: document.getElementById('chatbox').clientHeight } };
            for (const id of ids) {
                const el = document.getElementById(id);
                const r = el.getBoundingClientRect();
                out[id] = { top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right), w: Math.round(r.width), h: Math.round(r.height) };
            }
            return out;
        };
    </script>
</body>

</html>
