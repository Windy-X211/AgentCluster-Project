<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>流星雨</title>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');

    let W = 0, H = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    // 背景星（静态 + 轻闪烁）
    let stars = [];
    // 流星群
    let meteors = [];
    // 辐射点（屏幕右上角外侧，作为所有流星的出发点参考）
    let origin = { x: 0, y: 0 };

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        cv.style.width = W + 'px';
        cv.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 辐射点定在右上偏外，让流星往左下扫过整个画面
        origin.x = W * 0.82;
        origin.y = -H * 0.15;

        // 背景星
        stars = [];
        const n = Math.min(220, Math.floor(W * H / 9000));
        for (let i = 0; i < n; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.1 + 0.2,
                a: Math.random() * Math.PI * 2,
                s: Math.random() * 0.02 + 0.004,
                base: 0.35 + Math.random() * 0.5
            });
        }
    }

    // 生成一波流星：所有流星方向几乎一致（沿辐射点发散角 + 微小抖动）
    function spawnWave(count) {
        // 每波有一个基准方向（指向左下），并允许极小抖动 → 看起来齐整
        const baseAngle = Math.atan2(H * 0.55 - origin.y, W * 0.15 - origin.x) + (Math.random() - 0.5) * 0.06;
        const baseSpeed = 5.5 + Math.random() * 2;
        const waveHue = Math.random() < 0.75 ? 'gold' : 'cool';
        for (let i = 0; i < count; i++) {
            const angleJitter = (Math.random() - 0.5) * 0.035;   // 方向抖动极小
            const speedJitter = (Math.random() - 0.5) * 1.0;      // 速度抖动小      // 速度抖动小
            const offX = (Math.random() - 0.5) * W * 0.35;         // 起始沿方向线的偏移
            const offY = (Math.random() - 0.5) * H * 0.18;
            meteors.push({
                x: origin.x + Math.cos(baseAngle) * (Math.random() * 320) + offX,
                y: origin.y + Math.sin(baseAngle) * (Math.random() * 320) + offY,
                vx: Math.cos(baseAngle + angleJitter) * (baseSpeed + speedJitter),
                vy: Math.sin(baseAngle + angleJitter) * (baseSpeed + speedJitter),
                life: 0,
                maxLife: 150 + Math.random() * 60,
                len: 320 + Math.random() * 300,   // 更长更壮
                hue: waveHue,
                width: 1.8 + Math.random() * 0.8
            });
        }
        // 粒子总量封顶
        if (meteors.length > 220) meteors.splice(0, meteors.length - 220);
    }

    let waveTimer = 0;

    function frame() {
        ctx.clearRect(0, 0, W, H);

        // 背景星（闪烁）
        for (const st of stars) {
            st.a += st.s;
            const tw = st.base + 0.35 * Math.sin(st.a);
            ctx.globalAlpha = Math.max(0, Math.min(1, tw));
            ctx.fillStyle = '#dfe6ff';
            ctx.beginPath();
            ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
            ctx.fill();
        }

        // 波次生成：约 3.2 秒一波，每波 12~20 颗
        waveTimer++;
        if (waveTimer > 190) {
            waveTimer = 0;
            spawnWave(12 + Math.floor(Math.random() * 9));
        }

        // 流星绘制
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.x += m.vx;
            m.y += m.vy;
            m.life++;
            const phase = m.life / m.maxLife;
            // 先淡入再淡出
            const alpha = Math.sin(Math.max(0, Math.min(1, phase)) * Math.PI);

            // 尾端（沿运动方向反向延长）
            const speed = Math.hypot(m.vx, m.vy);
            const nx = m.vx / speed, ny = m.vy / speed;
            const tailLen = m.len * (0.4 + 0.6 * alpha);
            const tx = m.x - nx * tailLen;
            const ty = m.y - ny * tailLen;

            // 拖尾渐变（头亮尾消）
            const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
            if (m.hue === 'gold') {
                grad.addColorStop(0.0, 'rgba(255,255,235,' + alpha.toFixed(3) + ')');
                grad.addColorStop(0.15, 'rgba(255,215,140,' + (alpha * 0.85).toFixed(3) + ')');
                grad.addColorStop(0.5, 'rgba(255,160,80,' + (alpha * 0.35).toFixed(3) + ')');
                grad.addColorStop(1.0, 'rgba(255,120,50,0)');
            } else {
                grad.addColorStop(0.0, 'rgba(255,255,255,' + alpha.toFixed(3) + ')');
                grad.addColorStop(0.2, 'rgba(190,220,255,' + (alpha * 0.75).toFixed(3) + ')');
                grad.addColorStop(0.6, 'rgba(120,170,255,' + (alpha * 0.3).toFixed(3) + ')');
                grad.addColorStop(1.0, 'rgba(90,140,230,0)');
            }

            // 主拖尾
            ctx.globalAlpha = 1;
            ctx.strokeStyle = grad;
            ctx.lineWidth = m.width;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tx, ty);
            ctx.stroke();

            // 外层柔光（宽而淡）
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = grad;
            ctx.lineWidth = m.width * 3.5;
            ctx.globalAlpha = alpha * 0.55;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tx, ty);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = 'source-over';

            // 头部亮点（辉光圆）
            ctx.globalCompositeOperation = 'lighter';
            const glowR = 4.5;
            const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, glowR);
            g.addColorStop(0, 'rgba(255,255,255,' + (alpha).toFixed(3) + ')');
            g.addColorStop(0.4, 'rgba(255,220,160,' + (alpha * 0.7).toFixed(3) + ')');
            g.addColorStop(1, 'rgba(255,200,120,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(m.x, m.y, glowR, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            if (m.life >= m.maxLife || m.x < -140 || m.y > H + 140 || m.x > W + 140) {
                meteors.splice(i, 1);
            }
        }

        requestAnimationFrame(frame);
    }

    // 初始：先撒一波，紧接着补一小波制造"齐整扫过"效果
    function init() {
        meteors = [];
        spawnWave(16);
        setTimeout(() => spawnWave(10), 260);
        setTimeout(() => spawnWave(8), 520);
    }

    let resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { resize(); init(); }, 150);
    });

    resize();
    init();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
