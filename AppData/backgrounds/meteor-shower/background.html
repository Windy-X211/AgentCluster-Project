<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>流星雨</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        (function () {
            const cv = document.getElementById('c');
            const ctx = cv.getContext('2d');
            let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
            let stars = [], meteors = [];

            function resize() {
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                cv.style.width = W + 'px'; cv.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function init() {
                const n = Math.min(200, Math.floor(W * H / 8000));
                stars = [];
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.1 + 0.2,
                        a: Math.random() * Math.PI * 2,
                        s: Math.random() * 0.02 + 0.003
                    });
                }
                meteors = [];
                // 初始撒一波流星
                for (let i = 0; i < 6; i++) spawnMeteor(true);
            }

            function spawnMeteor(initial) {
                meteors.push({
                    x: Math.random() * W * 1.2,
                    y: -Math.random() * H * 0.3 - (initial ? Math.random() * H * 0.5 : 0),
                    vx: -(3 + Math.random() * 4),
                    vy: 5 + Math.random() * 5,
                    life: initial ? Math.random() * 30 : 0,
                    maxLife: 70 + Math.random() * 50,
                    len: 100 + Math.random() * 160,
                    hue: Math.random() < 0.3 ? 'warm' : 'cool'
                });
            }

            function frame(t) {
                ctx.clearRect(0, 0, W, H);
                // 背景星
                for (const st of stars) {
                    st.a += st.s;
                    ctx.globalAlpha = 0.4 + 0.5 * Math.sin(st.a);
                    ctx.fillStyle = '#cdd9ff';
                    ctx.beginPath();
                    ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                // 持续生成流星
                if (meteors.length < 14 && Math.random() < 0.06) spawnMeteor(false);
                // 流星
                for (let i = meteors.length - 1; i >= 0; i--) {
                    const m = meteors[i];
                    m.x += m.vx; m.y += m.vy; m.life++;
                    const phase = m.life / m.maxLife;
                    const alpha = Math.sin(phase * Math.PI);
                    const tx = m.x - m.vx * m.len * 0.12;
                    const ty = m.y - m.vy * m.len * 0.12;
                    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
                    if (m.hue === 'warm') {
                        grad.addColorStop(0, 'rgba(255,240,210,' + alpha + ')');
                        grad.addColorStop(0.4, 'rgba(255,180,120,' + alpha * 0.4 + ')');
                        grad.addColorStop(1, 'rgba(255,180,120,0)');
                    } else {
                        grad.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                        grad.addColorStop(0.4, 'rgba(170,200,255,' + alpha * 0.5 + ')');
                        grad.addColorStop(1, 'rgba(170,200,255,0)');
                    }
                    ctx.globalAlpha = 1;
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.8;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                    if (m.life >= m.maxLife || m.x < -80 || m.y > H + 80) meteors.splice(i, 1);
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(frame);
            }

            let resizeTimer = null;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () { resize(); init(); }, 150);
            });
            resize(); init(); requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
