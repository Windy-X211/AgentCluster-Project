<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>CHRONO SHOOTER - 时序回溯射手</title>
<style>
/* ============ 全局 ============ */
:root{
  --bg:#0A0E1A; --bg2:#10162B; --cyan:#00F0FF; --magenta:#FF00E0;
  --violet:#7B2FFF; --amber:#FFB300; --red:#FF2D55; --white:#E0FFFF;
  --dark:#1A2238; --panel:rgba(10,14,26,0.75);
}
*{ margin:0; padding:0; box-sizing:border-box; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--white);
  font-family:'Orbitron','Rajdhani','Segoe UI',monospace; }
canvas{ display:block; }
.hidden{ display:none !important; }

/* ============ 霓虹描边面板 ============ */
.panel{
  background:var(--panel); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 12px rgba(0,240,255,0.35), inset 0 0 18px rgba(0,240,255,0.08);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.title-glow{ text-shadow:0 0 12px rgba(0,240,255,0.8), 0 0 40px rgba(0,240,255,0.4); }
.mg-glow{ text-shadow:0 0 12px rgba(255,0,224,0.8), 0 0 40px rgba(255,0,224,0.4); }

/* ============ 主菜单 ============ */
#menu{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px;
  background:radial-gradient(ellipse at 50% 40%, rgba(16,22,43,0.85) 0%, rgba(10,14,26,0.96) 70%); }
#menu h1{ font-size:64px; letter-spacing:10px; color:var(--cyan); }
#menu h1 .m{ color:var(--magenta); }
#menu .sub{ font-size:16px; letter-spacing:4px; color:#6E87A8; margin-top:-14px; }
#menu .btn-row{ display:flex; flex-direction:column; gap:14px; width:300px; }
.mbtn{ padding:14px 24px; font-family:inherit; font-size:17px; letter-spacing:3px; color:var(--cyan);
  background:rgba(0,240,255,0.05); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 10px rgba(0,240,255,0.25); cursor:pointer; transition:all .18s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.mbtn:hover{ background:rgba(255,0,224,0.2); border-color:var(--magenta); color:var(--white);
  box-shadow:0 0 16px rgba(255,0,224,0.5); }
#menu .foot{ position:absolute; bottom:22px; font-size:12px; letter-spacing:2px; color:rgba(255,0,224,0.6); }

/* ============ 操作说明页 ============ */
#controls{ position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; background:rgba(10,14,26,0.96); }
#controls .panel{ padding:44px 60px; text-align:center; }
#controls h2{ color:var(--cyan); letter-spacing:6px; margin-bottom:18px; font-size:26px; }
#controls p{ font-size:16px; line-height:2.2; color:var(--white); letter-spacing:1px; }
#controls .q{ color:var(--magenta); font-weight:bold; }

/* ============ HUD 顶层 ============ */
#hud{ position:fixed; inset:0; z-index:30; pointer-events:none; display:none; }
#topbar{ position:absolute; top:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:26px; padding:8px 22px; font-size:14px; letter-spacing:2px;
  background:rgba(0,240,255,0.08); border:1px solid rgba(0,240,255,0.55);
  box-shadow:0 0 14px rgba(0,240,255,0.3); color:var(--cyan);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
#topbar b{ color:var(--white); }
#kills{ color:var(--violet); }

/* 准星 */
#crosshair{ position:absolute; left:50%; top:50%; width:0; height:0; }
#crosshair span{ position:absolute; background:var(--white); box-shadow:0 0 6px rgba(224,255,255,0.8); }
#crosshair .h{ left:-10px; top:-1px; width:20px; height:2px; }
#crosshair .v{ left:-1px; top:-10px; width:2px; height:20px; }
#crosshair .dot{ left:-2px; top:-2px; width:4px; height:4px; border-radius:50%; background:var(--cyan); }
#crosshair.hit .h,#crosshair.hit .v{ background:var(--red); box-shadow:0 0 8px var(--red); }
#crosshair.hit .dot{ background:var(--red); }

/* 底部栏 */
#bottombar{ position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
  display:flex; gap:30px; align-items:flex-end; }
.meter{ width:250px; }
.meter .lab{ font-size:12px; letter-spacing:2px; color:#6E87A8; margin-bottom:5px; display:flex; justify-content:space-between; }
.meter .bar{ height:12px; border:1px solid rgba(0,240,255,0.5); background:rgba(0,240,255,0.06);
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }
.meter .fill{ height:100%; width:100%; transition:width .12s; }
#hpFill{ background:linear-gradient(90deg,#0077AA,#00F0FF); box-shadow:0 0 10px rgba(0,240,255,0.6); }
#hpFill.low{ background:linear-gradient(90deg,#8A4A00,#FFB300); box-shadow:0 0 12px rgba(255,179,0,0.9); animation:blink .5s infinite; }
#enFill{ background:linear-gradient(90deg,#8800AA,#FF00E0); box-shadow:0 0 10px rgba(255,0,224,0.6); }
#enFill.gray{ background:#444; box-shadow:none; }
@keyframes blink{ 50%{ opacity:.55; } }
#weapons{ display:flex; gap:14px; }
.wslot{ padding:6px 12px; border:1px solid rgba(0,240,255,0.4); font-size:13px; letter-spacing:1px;
  background:rgba(0,240,255,0.05); color:#6E87A8; }
.wslot.active{ border-color:var(--cyan); color:var(--white); box-shadow:0 0 10px rgba(0,240,255,0.4); }
.wslot .ammo{ color:var(--cyan); }
.wslot .ammo.low{ color:var(--amber); }

/* 飘字 */
#floaters{ position:absolute; right:26px; top:90px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.floater{ font-size:15px; letter-spacing:1px; text-shadow:0 0 8px rgba(0,240,255,0.8);
  animation:floatUp 1.2s ease-out forwards; }
.floater.mg{ color:var(--magenta); text-shadow:0 0 8px rgba(255,0,224,0.8); }
@keyframes floatUp{ 0%{ opacity:0; transform:translateY(8px); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-30px); } }

/* 波次横幅 */
#banner{ position:absolute; top:120px; left:50%; transform:translateX(-50%); padding:10px 34px;
  font-size:20px; letter-spacing:4px; color:var(--cyan); opacity:0;
  background:rgba(10,14,26,0.7); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 20px rgba(0,240,255,0.4); white-space:nowrap;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
#banner.show{ animation:bannerIn 2.4s ease forwards; }
#banner.elite{ color:var(--magenta); border-color:var(--magenta); box-shadow:0 0 24px rgba(255,0,224,0.6); }
@keyframes bannerIn{ 0%{ opacity:0; transform:translateX(-50%) translateY(-14px); }
  18%{ opacity:1; transform:translateX(-50%) translateY(0); } 80%{ opacity:1; } 100%{ opacity:0; } }

/* 回溯演出覆盖层 */
#rewind{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(0,240,255,0.28); backdrop-filter:blur(1px); }
#rewind .big{ font-size:64px; letter-spacing:14px; color:var(--cyan); -webkit-text-stroke:1px var(--magenta);
  text-shadow:0 0 30px rgba(0,240,255,0.9); animation:rwPulse .6s ease; }
@keyframes rwPulse{ 0%{ transform:scale(1.6); opacity:0; } 30%{ opacity:1; } 100%{ transform:scale(1); } }
#rewindClock{ font-size:16px; letter-spacing:4px; color:var(--white); opacity:.85; }

/* 受击红闪 / 低血渐晕 / 死亡 */
#hurt{ position:absolute; inset:0; display:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(255,45,85,0.5) 100%); }
#lowhp{ position:absolute; inset:0; display:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,45,85,0.35) 100%); animation:blink 1s infinite; }
#dead{ position:absolute; inset:0; display:none; background:rgba(255,30,60,0.28); }

/* 结算/暂停面板 */
#endpanel{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(10,14,26,0.9); }
#endpanel .box{ min-width:460px; padding:44px 50px; text-align:center; }
#endpanel h2{ font-size:30px; letter-spacing:6px; margin-bottom:20px; }
#endpanel .txt{ font-size:15px; line-height:2.1; color:#9FB3CE; margin-bottom:18px; white-space:pre-line; }
#endpanel .stat{ font-size:14px; color:var(--violet); letter-spacing:2px; margin-bottom:22px; }
#endpanel .row{ display:flex; gap:14px; justify-content:center; }
/* 暂停 */
#pause{ position:fixed; inset:0; z-index:65; display:none; align-items:center; justify-content:center; background:rgba(10,14,26,0.85); }
#pause .box{ padding:40px 56px; text-align:center; }
#pause h2{ color:var(--cyan); letter-spacing:5px; font-size:26px; margin-bottom:24px; }
#pause .row{ display:flex; gap:14px; justify-content:center; }

/* 提示条（左下角操作提示） */
#tip{ position:absolute; left:26px; bottom:26px; font-size:13px; letter-spacing:1px; color:rgba(224,255,255,0.6); line-height:1.9; }
#tip b{ color:var(--cyan); }
</style>
</head>
<body>

<!-- 主菜单 -->
<div id='menu'>
  <h1 class='title-glow'>CHRONO <span class='m mg-glow'>SHOOTER</span></h1>
  <div class='sub'>你欠时间一条命。现在，用三秒去还。</div>
  <div class='btn-row'>
    <button class='mbtn' id='btnStart'>开始演武 START</button>
    <button class='mbtn' id='btnControls'>操作说明 CONTROLS</button>
    <button class='mbtn' id='btnLedger'>信用记录 LEDGER</button>
  </div>
  <div class='foot'>时之商会荣誉出品 · 时间债务不因死亡而免除</div>
</div>

<!-- 操作说明 -->
<div id='controls'>
  <div class='panel'>
    <h2>操作说明 CONTROLS</h2>
    <p>WASD 移动 · 鼠标瞄准 · 左键射击 · R 换弹 · 空格 跳跃<br>
       <span class='q'>Q 回卷时间 3 秒</span>——子弹会倒飞，敌人会退场，你的失误会被抹去。<br>
       能量有限（40/次），谨慎使用。</p>
    <br><button class='mbtn' id='btnBack'>返回 RETURN</button>
  </div>
</div>

<!-- HUD -->
<div id='hud'>
  <div id='topbar'>
    <span id='waveLabel'>WAVE 1/8</span>
    <span>残敌 REMAINING: <b id='remain'>0</b></span>
    <span id='kills'>击杀 0</span>
  </div>
  <div id='crosshair'><span class='h'></span><span class='v'></span><span class='dot'></span></div>
  <div id='bottombar'>
    <div class='meter' id='hpMeter'>
      <div class='lab'><span>护甲 HULL</span><span id='hpNum'>100</span></div>
      <div class='bar'><div class='fill' id='hpFill'></div></div>
    </div>
    <div class='meter' id='enMeter'>
      <div class='lab'><span>回卷能量 REWIND</span><span id='enNum'>100</span></div>
      <div class='bar'><div class='fill' id='enFill'></div></div>
    </div>
    <div id='weapons'></div>
  </div>
  <div id='floaters'></div>
  <div id='banner'>WAVE 1</div>
  <div id='rewind'><div class='big'>REWIND</div><div id='rewindClock'></div></div>
  <div id='hurt'></div>
  <div id='lowhp'></div>
  <div id='dead'></div>
  <div id='tip'><b>WASD</b> 移动 <b>Q</b> 回卷 3秒 <b>R</b> 换弹 <b>1/2/3</b> 切枪</div>
</div>

<!-- 结算 -->
<div id='endpanel'>
  <div class='box panel'>
    <h2 id='endTitle'>结算</h2>
    <div class='txt' id='endTxt'></div>
    <div class='stat' id='endStat'></div>
    <div class='row'>
      <button class='mbtn' id='btnRetry'>再战 RETRY</button>
      <button class='mbtn' id='btnMenu'>主菜单 MENU</button>
    </div>
  </div>
</div>

<!-- 暂停 -->
<div id='pause'>
  <div class='box panel'>
    <h2>时间冻结——商会在等账单</h2>
    <div class='row'>
      <button class='mbtn' id='btnResume'>继续演武 CONTINUE</button>
      <button class='mbtn' id='btnQuit'>认输 FORFEIT</button>
    </div>
  </div>
</div>

<script src='assets/lib/three.min.js'></script>
<script>
'use strict';
// ===MOD-CONFIG===
/* 全局配置 - 数值遵循 02-核心玩法设计.md */
const CFG = {
  arena: 60, wallH: 8,
  player: {
    hp: 100, speed: 8.0, aimSpeed: 3.2, jumpH: 1.1, landStun: 0.15,
    sens: 0.35, eyeH: 1.7, radius: 0.55, accel: 60, gravity: 22
  },
  rewind: {
    duration: 3.0, cost: 40, energyMax: 100, energyRegen: 10,
    energyKill: 5, energyWave: 25, show: 0.6, minEnergy: 40,
    elitePack: 40, bomberEnergy: 10
  },
  weapon: {
    rifle:   { name:'脉冲步枪', dmg:15, rpm:8.0, mag:30, reload:1.2, spread:2.0, pellet:1, auto:true },
    shotgun: { name:'霰弹枪',   dmg:9,  rpm:1.4, mag:6,  reload:1.8, spread:8.0, pellet:8, auto:false, unlockWave:3 },
    charger: { name:'蓄能炮',   dmg:60, rpm:0.8, mag:4,  reload:2.2, spread:0.5, pellet:1, auto:false, charge:1.5, unlockByElite:true }
  },
  enemy: {
    E1: { name:'游荡者', hp:30, atk:8,  speed:3.0, range:2.0, cd:1.0, color:0x00F0FF, size:0.9, melee:true },
    E2: { name:'射手',   hp:20, atk:12, speed:2.2, range:10,  cd:1.6, color:0x7B2FFF, size:0.8, ranged:true, projSpeed:18 },
    E3: { name:'冲锋者', hp:45, atk:10, speed:5.5, range:1.8, cd:0.9, color:0xFFB300, size:1.0, melee:true },
    E4: { name:'重装者', hp:120,atk:22, speed:1.4, range:3.0, cd:1.4, color:0x2A3040, size:1.8, melee:true, heavy:true },
    E5: { name:'爆裂者', hp:40, atk:20, speed:4.0, range:2.6, cd:0.0, color:0xFF2D55, size:0.9, bomber:true, boomRadius:5 },
    E6: { name:'哨兵精英', hp:250, atk:15, speed:2.0, range:14, cd:1.2, color:0xFF00E0, size:1.4, elite:true, ranged:true, projSpeed:22, burst:3 }
  },
  spawnPoints: [[0,0,-27],[0,0,27],[-27,0,0],[27,0,0],[-19,0,-19],[-19,0,19],[19,0,-19],[19,0,19]],
  // 波次表 (8 波基础)
  waves: [
    { E1:4 },
    { E1:5, E2:2 },
    { E1:4, E2:3, E3:2 },
    { E1:6, E2:4, E3:2 },
    { E2:4, E3:3, E4:1, E6:1 },
    { E2:6, E3:4, E4:2 },
    { E3:8, E4:3, E5:3 },
    { E3:6, E4:3, E5:4, E6:1 }
  ]
};

/* 波次提示语 - 03-世界观与叙事.md 4.2 */
const WAVE_LINES = [
  '回声训练场——热热身，别浪费那三秒。',
  '裂隙步卒进场。它们记得你，虽然你还没见过它们。',
  '高速目标出现——时间噪音不喜欢站着不动的人。',
  '商会加注了。小心头顶的激光点名。',
  '中场休息？不存在的。波次翻倍，债务不变。',
  '机械兵学会了配合。你也该学会用 Q 了。',
  '最后一层之前——深呼吸。回忆一下你欠了多少。',
  '棱镜圣殿。赢了，债务清零；输了，时间清零。'
];
const WAVE_NAMES = ['回声训练场','裂隙步卒','时间噪音','商会加注','债务翻倍','机械配合','最后一层','棱镜圣殿'];
const END_LINES = {
  death: ['时间线终止。KAI 的债务将由其继承人继承。','商会温馨提示：棱镜芯片仍在回收中，请勿私自拆除。','你用了你的三秒。它们不够。下次，试试用四秒——如果你买得起的话。'],
  win: ['债务清偿。恭喜，KAI，你自由了。','——当然，自由也是要付利息的。明天见。']
};
const INTRO_TEXT = '「裂隙竞技场，第 09 区，现在是——塔台时间 22:00。」\n「角斗士 KAI，你的时间债务：37,000 信用点。」\n「规则很简单：活过今晚的演武。商会为你准备了八层舞台。」\n「哦，还有一件事——你脑子里的那三秒，是商会借你的。用的时候，省着点。」';
// ===MOD-UTIL===
function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function damp(v,t,lambda,dt){ return v + (t-v)*(1-Math.exp(-lambda*dt)); }
function dist2D(ax,az,bx,bz){ const dx=ax-bx, dz=az-bz; return Math.sqrt(dx*dx+dz*dz); }

/* 深拷贝快照 */
function cloneSnap(o){
  if(Array.isArray(o)) return o.map(cloneSnap);
  if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=cloneSnap(o[k]); return r; }
  return o;
}

/* 简单四元素 Quaternion 序列化 */
function qToArr(q){ return [q.x,q.y,q.z,q.w]; }
function qFromArr(q,a){ q.set(a[0],a[1],a[2],a[3]); }
function vecToArr(v){ return [v.x,v.y,v.z]; }
function vecFromArr(v,a){ v.set(a[0],a[1],a[2]); }

/* 显示横幅 */
function showBanner(text, elite){
  const b = document.getElementById('banner');
  b.textContent = text;
  b.className = elite ? 'show elite' : 'show';
  setTimeout(()=>{ if(b.className) b.className=''; }, 2500);
}

/* 飘字 */
function addFloater(text, isMg){
  const f = document.createElement('div');
  f.className = 'floater' + (isMg?' mg':'');
  f.textContent = text;
  document.getElementById('floaters').appendChild(f);
  setTimeout(()=>{ if(f.parentNode) f.parentNode.removeChild(f); }, 1300);
}
// ===MOD-SCENE===
// ===MOD-PLAYER===
// ===MOD-WEAPON===
// ===MOD-ENEMY===
// ===MOD-REWIND===

// ===MOD-MENU===
// ===MOD-MAIN===
</script>
</body>
</html>
