<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>CHRONO SHOOTER - 时序回溯射手</title>
<style>
/* ============ 全局 ============ */
:root{
  --bg:#0A0E1A; --bg2:#10162B; --cyan:#00F0FF; --magenta:#FF00E0;
  --violet:#7B2FFF; --amber:#FFB300; --red:#FF2D55; --white:#E0FFFF;
  --dark:#1A2238; --panel:rgba(10,14,26,0.75);
}
*{ margin:0; padding:0; box-sizing:border-box; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--white);
  font-family:'Orbitron','Rajdhani','Segoe UI',monospace; }
canvas{ display:block; }
.hidden{ display:none !important; }

/* ============ 霓虹描边面板 ============ */
.panel{
  background:var(--panel); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 12px rgba(0,240,255,0.35), inset 0 0 18px rgba(0,240,255,0.08);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.title-glow{ text-shadow:0 0 12px rgba(0,240,255,0.8), 0 0 40px rgba(0,240,255,0.4); }
.mg-glow{ text-shadow:0 0 12px rgba(255,0,224,0.8), 0 0 40px rgba(255,0,224,0.4); }

/* ============ 主菜单 ============ */
#menu{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px;
  background:radial-gradient(ellipse at 50% 40%, rgba(16,22,43,0.85) 0%, rgba(10,14,26,0.96) 70%); }
#menu h1{ font-size:64px; letter-spacing:10px; color:var(--cyan); }
#menu h1 .m{ color:var(--magenta); }
#menu .sub{ font-size:16px; letter-spacing:4px; color:#6E87A8; margin-top:-14px; }
#menu .btn-row{ display:flex; flex-direction:column; gap:14px; width:300px; }
.mbtn{ padding:14px 24px; font-family:inherit; font-size:17px; letter-spacing:3px; color:var(--cyan);
  background:rgba(0,240,255,0.05); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 10px rgba(0,240,255,0.25); cursor:pointer; transition:all .18s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); }
.mbtn:hover{ background:rgba(255,0,224,0.2); border-color:var(--magenta); color:var(--white);
  box-shadow:0 0 16px rgba(255,0,224,0.5); }
#menu .foot{ position:absolute; bottom:22px; font-size:12px; letter-spacing:2px; color:rgba(255,0,224,0.6); }

/* ============ 操作说明页 ============ */
#controls{ position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; background:rgba(10,14,26,0.96); }
#controls .panel{ padding:44px 60px; text-align:center; }
#controls h2{ color:var(--cyan); letter-spacing:6px; margin-bottom:18px; font-size:26px; }
#controls p{ font-size:16px; line-height:2.2; color:var(--white); letter-spacing:1px; }
#controls .q{ color:var(--magenta); font-weight:bold; }

/* ============ HUD 顶层 ============ */
#hud{ position:fixed; inset:0; z-index:30; pointer-events:none; display:none; }
#topbar{ position:absolute; top:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:26px; padding:8px 22px; font-size:14px; letter-spacing:2px;
  background:rgba(0,240,255,0.08); border:1px solid rgba(0,240,255,0.55);
  box-shadow:0 0 14px rgba(0,240,255,0.3); color:var(--cyan);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
#topbar b{ color:var(--white); }
#kills{ color:var(--violet); }

/* 准星 */
#crosshair{ position:absolute; left:50%; top:50%; width:0; height:0; }
#crosshair span{ position:absolute; background:var(--white); box-shadow:0 0 6px rgba(224,255,255,0.8); }
#crosshair .h{ left:-10px; top:-1px; width:20px; height:2px; }
#crosshair .v{ left:-1px; top:-10px; width:2px; height:20px; }
#crosshair .dot{ left:-2px; top:-2px; width:4px; height:4px; border-radius:50%; background:var(--cyan); }
#crosshair.hit .h,#crosshair.hit .v{ background:var(--red); box-shadow:0 0 8px var(--red); }
#crosshair.hit .dot{ background:var(--red); }

/* 底部栏 */
#bottombar{ position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
  display:flex; gap:30px; align-items:flex-end; }
.meter{ width:250px; }
.meter .lab{ font-size:12px; letter-spacing:2px; color:#6E87A8; margin-bottom:5px; display:flex; justify-content:space-between; }
.meter .bar{ height:12px; border:1px solid rgba(0,240,255,0.5); background:rgba(0,240,255,0.06);
  clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px); }
.meter .fill{ height:100%; width:100%; transition:width .12s; }
#hpFill{ background:linear-gradient(90deg,#0077AA,#00F0FF); box-shadow:0 0 10px rgba(0,240,255,0.6); }
#hpFill.low{ background:linear-gradient(90deg,#8A4A00,#FFB300); box-shadow:0 0 12px rgba(255,179,0,0.9); animation:blink .5s infinite; }
#enFill{ background:linear-gradient(90deg,#8800AA,#FF00E0); box-shadow:0 0 10px rgba(255,0,224,0.6); }
#enFill.gray{ background:#444; box-shadow:none; }
@keyframes blink{ 50%{ opacity:.55; } }
#weapons{ display:flex; gap:14px; }
.wslot{ padding:6px 12px; border:1px solid rgba(0,240,255,0.4); font-size:13px; letter-spacing:1px;
  background:rgba(0,240,255,0.05); color:#6E87A8; }
.wslot.active{ border-color:var(--cyan); color:var(--white); box-shadow:0 0 10px rgba(0,240,255,0.4); }
.wslot .ammo{ color:var(--cyan); }
.wslot .ammo.low{ color:var(--amber); }

/* 飘字 */
#floaters{ position:absolute; right:26px; top:90px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.floater{ font-size:15px; letter-spacing:1px; text-shadow:0 0 8px rgba(0,240,255,0.8);
  animation:floatUp 1.2s ease-out forwards; }
.floater.mg{ color:var(--magenta); text-shadow:0 0 8px rgba(255,0,224,0.8); }
@keyframes floatUp{ 0%{ opacity:0; transform:translateY(8px); } 20%{ opacity:1; } 100%{ opacity:0; transform:translateY(-30px); } }

/* 波次横幅 */
#banner{ position:absolute; top:120px; left:50%; transform:translateX(-50%); padding:10px 34px;
  font-size:20px; letter-spacing:4px; color:var(--cyan); opacity:0;
  background:rgba(10,14,26,0.7); border:1px solid rgba(0,240,255,0.6);
  box-shadow:0 0 20px rgba(0,240,255,0.4); white-space:nowrap;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
#banner.show{ animation:bannerIn 2.4s ease forwards; }
#banner.elite{ color:var(--magenta); border-color:var(--magenta); box-shadow:0 0 24px rgba(255,0,224,0.6); }
@keyframes bannerIn{ 0%{ opacity:0; transform:translateX(-50%) translateY(-14px); }
  18%{ opacity:1; transform:translateX(-50%) translateY(0); } 80%{ opacity:1; } 100%{ opacity:0; } }

/* 回溯演出覆盖层 */
#rewind{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(0,240,255,0.28); backdrop-filter:blur(1px); }
#rewind .big{ font-size:64px; letter-spacing:14px; color:var(--cyan); -webkit-text-stroke:1px var(--magenta);
  text-shadow:0 0 30px rgba(0,240,255,0.9); animation:rwPulse .6s ease; }
@keyframes rwPulse{ 0%{ transform:scale(1.6); opacity:0; } 30%{ opacity:1; } 100%{ transform:scale(1); } }
#rewindClock{ font-size:16px; letter-spacing:4px; color:var(--white); opacity:.85; }

/* 受击红闪 / 低血渐晕 / 死亡 */
#hurt{ position:absolute; inset:0; display:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(255,45,85,0.5) 100%); }
#lowhp{ position:absolute; inset:0; display:none; background:radial-gradient(ellipse at center, transparent 45%, rgba(255,45,85,0.35) 100%); animation:blink 1s infinite; }
#dead{ position:absolute; inset:0; display:none; background:rgba(255,30,60,0.28); }

/* 结算/暂停面板 */
#endpanel{ position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center; background:rgba(10,14,26,0.9); }
#endpanel .box{ min-width:460px; padding:44px 50px; text-align:center; }
#endpanel h2{ font-size:30px; letter-spacing:6px; margin-bottom:20px; }
#endpanel .txt{ font-size:15px; line-height:2.1; color:#9FB3CE; margin-bottom:18px; white-space:pre-line; }
#endpanel .stat{ font-size:14px; color:var(--violet); letter-spacing:2px; margin-bottom:22px; }
#endpanel .row{ display:flex; gap:14px; justify-content:center; }
/* 暂停 */
#pause{ position:fixed; inset:0; z-index:65; display:none; align-items:center; justify-content:center; background:rgba(10,14,26,0.85); }
#pause .box{ padding:40px 56px; text-align:center; }
#pause h2{ color:var(--cyan); letter-spacing:5px; font-size:26px; margin-bottom:24px; }
#pause .row{ display:flex; gap:14px; justify-content:center; }

/* 提示条（左下角操作提示） */
#tip{ position:absolute; left:26px; bottom:26px; font-size:13px; letter-spacing:1px; color:rgba(224,255,255,0.6); line-height:1.9; }
#tip b{ color:var(--cyan); }
</style>
</head>
<body>

<!-- 主菜单 -->
<div id='menu'>
  <h1 class='title-glow'>CHRONO <span class='m mg-glow'>SHOOTER</span></h1>
  <div class='sub'>你欠时间一条命。现在，用三秒去还。</div>
  <div class='btn-row'>
    <button class='mbtn' id='btnStart'>开始演武 START</button>
    <button class='mbtn' id='btnControls'>操作说明 CONTROLS</button>
    <button class='mbtn' id='btnLedger'>信用记录 LEDGER</button>
  </div>
  <div class='foot'>时之商会荣誉出品 · 时间债务不因死亡而免除</div>
</div>

<!-- 操作说明 -->
<div id='controls'>
  <div class='panel'>
    <h2>操作说明 CONTROLS</h2>
    <p>WASD 移动 · 鼠标瞄准 · 左键射击 · R 换弹 · 空格 跳跃<br>
       <span class='q'>Q 回卷时间 3 秒</span>——子弹会倒飞，敌人会退场，你的失误会被抹去。<br>
       能量有限（40/次），谨慎使用。</p>
    <br><button class='mbtn' id='btnBack'>返回 RETURN</button>
  </div>
</div>

<!-- HUD -->
<div id='hud'>
  <div id='topbar'>
    <span id='waveLabel'>WAVE 1/8</span>
    <span>残敌 REMAINING: <b id='remain'>0</b></span>
    <span id='kills'>击杀 0</span>
  </div>
  <div id='crosshair'><span class='h'></span><span class='v'></span><span class='dot'></span></div>
  <div id='bottombar'>
    <div class='meter' id='hpMeter'>
      <div class='lab'><span>护甲 HULL</span><span id='hpNum'>100</span></div>
      <div class='bar'><div class='fill' id='hpFill'></div></div>
    </div>
    <div class='meter' id='enMeter'>
      <div class='lab'><span>回卷能量 REWIND</span><span id='enNum'>100</span></div>
      <div class='bar'><div class='fill' id='enFill'></div></div>
    </div>
    <div id='weapons'></div>
  </div>
  <div id='floaters'></div>
  <div id='banner'>WAVE 1</div>
  <div id='rewind'><div class='big'>REWIND</div><div id='rewindClock'></div></div>
  <div id='hurt'></div>
  <div id='lowhp'></div>
  <div id='dead'></div>
  <div id='tip'><b>WASD</b> 移动 <b>Q</b> 回卷 3秒 <b>R</b> 换弹 <b>1/2/3</b> 切枪</div>
</div>

<!-- 结算 -->
<div id='endpanel'>
  <div class='box panel'>
    <h2 id='endTitle'>结算</h2>
    <div class='txt' id='endTxt'></div>
    <div class='stat' id='endStat'></div>
    <div class='row'>
      <button class='mbtn' id='btnRetry'>再战 RETRY</button>
      <button class='mbtn' id='btnMenu'>主菜单 MENU</button>
    </div>
  </div>
</div>

<!-- 暂停 -->
<div id='pause'>
  <div class='box panel'>
    <h2>时间冻结——商会在等账单</h2>
    <div class='row'>
      <button class='mbtn' id='btnResume'>继续演武 CONTINUE</button>
      <button class='mbtn' id='btnQuit'>认输 FORFEIT</button>
    </div>
  </div>
</div>

<script src='assets/lib/three.min.js'></script>
<script src='assets/lib/shaders/CopyShader.js'></script>
<script src='assets/lib/shaders/LuminosityHighPassShader.js'></script>
<script src='assets/lib/postprocessing/EffectComposer.js'></script>
<script src='assets/lib/postprocessing/RenderPass.js'></script>
<script src='assets/lib/postprocessing/ShaderPass.js'></script>
<script src='assets/lib/postprocessing/UnrealBloomPass.js'></script>
<script>
'use strict';
// ===MOD-CONFIG===
/* 全局配置 - 数值遵循 02-核心玩法设计.md */
const CFG = {
  arena: 60, wallH: 8,
  player: {
    hp: 100, speed: 8.0, aimSpeed: 3.2, jumpH: 1.1, landStun: 0.15,
    sens: 0.35, eyeH: 1.7, radius: 0.55, accel: 60, gravity: 22
  },
  rewind: {
    duration: 3.0, cost: 40, energyMax: 100, energyRegen: 10,
    energyKill: 5, energyWave: 25, show: 0.6, minEnergy: 40,
    elitePack: 40, bomberEnergy: 10
  },
  weapon: {
    rifle:   { name:'脉冲步枪', dmg:15, rpm:8.0, mag:30, reload:1.2, spread:2.0, pellet:1, auto:true },
    shotgun: { name:'霰弹枪',   dmg:9,  rpm:1.4, mag:6,  reload:1.8, spread:8.0, pellet:8, auto:false, unlockWave:3 },
    charger: { name:'蓄能炮',   dmg:60, rpm:0.8, mag:4,  reload:2.2, spread:0.5, pellet:1, auto:false, charge:1.5, unlockByElite:true }
  },
  enemy: {
    E1: { name:'游荡者', hp:30, atk:8,  speed:3.0, range:2.0, cd:1.0, color:0x00F0FF, size:0.9, melee:true },
    E2: { name:'射手',   hp:20, atk:12, speed:2.2, range:10,  cd:1.6, color:0x7B2FFF, size:0.8, ranged:true, projSpeed:18 },
    E3: { name:'冲锋者', hp:45, atk:10, speed:5.5, range:1.8, cd:0.9, color:0xFFB300, size:1.0, melee:true },
    E4: { name:'重装者', hp:120,atk:22, speed:1.4, range:3.0, cd:1.4, color:0x2A3040, size:1.8, melee:true, heavy:true },
    E5: { name:'爆裂者', hp:40, atk:20, speed:4.0, range:2.6, cd:0.0, color:0xFF2D55, size:0.9, bomber:true, boomRadius:5 },
    E6: { name:'哨兵精英', hp:250, atk:15, speed:2.0, range:14, cd:1.2, color:0xFF00E0, size:1.4, elite:true, ranged:true, projSpeed:22, burst:3 }
  },
  spawnPoints: [[0,0,-27],[0,0,27],[-27,0,0],[27,0,0],[-19,0,-19],[-19,0,19],[19,0,-19],[19,0,19]],
  // 波次表 (8 波基础)
  waves: [
    { E1:4 },
    { E1:5, E2:2 },
    { E1:4, E2:3, E3:2 },
    { E1:6, E2:4, E3:2 },
    { E2:4, E3:3, E4:1, E6:1 },
    { E2:6, E3:4, E4:2 },
    { E3:8, E4:3, E5:3 },
    { E3:6, E4:3, E5:4, E6:1 }
  ]
};

/* 波次提示语 - 03-世界观与叙事.md 4.2 */
const WAVE_LINES = [
  '回声训练场——热热身，别浪费那三秒。',
  '裂隙步卒进场。它们记得你，虽然你还没见过它们。',
  '高速目标出现——时间噪音不喜欢站着不动的人。',
  '商会加注了。小心头顶的激光点名。',
  '中场休息？不存在的。波次翻倍，债务不变。',
  '机械兵学会了配合。你也该学会用 Q 了。',
  '最后一层之前——深呼吸。回忆一下你欠了多少。',
  '棱镜圣殿。赢了，债务清零；输了，时间清零。'
];
const WAVE_NAMES = ['回声训练场','裂隙步卒','时间噪音','商会加注','债务翻倍','机械配合','最后一层','棱镜圣殿'];
const END_LINES = {
  death: ['时间线终止。KAI 的债务将由其继承人继承。','商会温馨提示：棱镜芯片仍在回收中，请勿私自拆除。','你用了你的三秒。它们不够。下次，试试用四秒——如果你买得起的话。'],
  win: ['债务清偿。恭喜，KAI，你自由了。','——当然，自由也是要付利息的。明天见。']
};
const INTRO_TEXT = '「裂隙竞技场，第 09 区，现在是——塔台时间 22:00。」\n「角斗士 KAI，你的时间债务：37,000 信用点。」\n「规则很简单：活过今晚的演武。商会为你准备了八层舞台。」\n「哦，还有一件事——你脑子里的那三秒，是商会借你的。用的时候，省着点。」';
// ===MOD-UTIL===
function rand(a,b){ return a + Math.random()*(b-a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function damp(v,t,lambda,dt){ return v + (t-v)*(1-Math.exp(-lambda*dt)); }
function dist2D(ax,az,bx,bz){ const dx=ax-bx, dz=az-bz; return Math.sqrt(dx*dx+dz*dz); }

/* 深拷贝快照 */
function cloneSnap(o){
  if(Array.isArray(o)) return o.map(cloneSnap);
  if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=cloneSnap(o[k]); return r; }
  return o;
}

/* 简单四元素 Quaternion 序列化 */
function qToArr(q){ return [q.x,q.y,q.z,q.w]; }
function qFromArr(q,a){ q.set(a[0],a[1],a[2],a[3]); }
function vecToArr(v){ return [v.x,v.y,v.z]; }
function vecFromArr(v,a){ v.set(a[0],a[1],a[2]); }

/* 显示横幅 */
function showBanner(text, elite){
  const b = document.getElementById('banner');
  b.textContent = text;
  b.className = elite ? 'show elite' : 'show';
  setTimeout(()=>{ if(b.className) b.className=''; }, 2500);
}

/* 飘字 */
function addFloater(text, isMg){
  const f = document.createElement('div');
  f.className = 'floater' + (isMg?' mg':'');
  f.textContent = text;
  document.getElementById('floaters').appendChild(f);
  setTimeout(()=>{ if(f.parentNode) f.parentNode.removeChild(f); }, 1300);
}
// ===MOD-SCENE===
function buildScene(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0A0E1A);
  scene.fog = new THREE.FogExp2(0x0A0E1A, 0.018);

  /* 地面：60x60 网格交替青/品红 */
  const grid = new THREE.GridHelper(CFG.arena, 30, 0x00F0FF, 0xFF00E0);
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  grid.position.y = 0.01;
  scene.add(grid);

  /* 底盘发光平面（微弱青色） */
  const floorMat = new THREE.MeshStandardMaterial({ color:0x0E1426, roughness:0.9, metalness:0.2 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(CFG.arena, CFG.arena), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = 0;
  scene.add(floor);

  /* 围墙 8m 高，4 面 */
  const wallMat = new THREE.MeshStandardMaterial({ color:0x1A2238, roughness:0.6, metalness:0.7, emissive:0x003344, emissiveIntensity:0.35 });
  const wallGeo = new THREE.BoxGeometry(CFG.arena+2, CFG.wallH, 0.5);
  const half = CFG.arena/2;
  const w1 = new THREE.Mesh(wallGeo, wallMat); w1.position.set(0, CFG.wallH/2, -half-1); scene.add(w1);
  const w2 = new THREE.Mesh(wallGeo, wallMat); w2.position.set(0, CFG.wallH/2, half+1);  scene.add(w2);
  const w3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, CFG.wallH, CFG.arena+2), wallMat); w3.position.set(-half-1, CFG.wallH/2, 0); scene.add(w3);
  const w4 = new THREE.Mesh(new THREE.BoxGeometry(0.5, CFG.wallH, CFG.arena+2), wallMat); w4.position.set(half+1, CFG.wallH/2, 0); scene.add(w4);

  /* 顶部青色光环（墙头霓虹线） */
  const ringMat = new THREE.MeshBasicMaterial({ color:0x00F0FF });
  const ring = new THREE.Mesh(new THREE.RingGeometry(CFG.arena/2+0.2, CFG.arena/2+0.6, 64), ringMat);
  ring.rotation.x = -Math.PI/2; ring.position.y = CFG.wallH+0.1; scene.add(ring);

  /* 棱镜核心：悬浮八面体 (0,6,0) 半径 1.5 */
  const prismGeo = new THREE.IcosahedronGeometry(1.5, 0);
  const prismMat = new THREE.MeshStandardMaterial({ color:0x00F0FF, transparent:true, opacity:0.75, emissive:0x00F0FF, emissiveIntensity:1.6 });
  const prism = new THREE.Mesh(prismGeo, prismMat);
  prism.position.set(0, 6, 0);
  scene.add(prism);
  const prismGlow = new THREE.PointLight(0x00F0FF, 1.2, 30);
  prismGlow.position.set(0, 6, 0);
  scene.add(prismGlow);

  /* 掩体：6 圆柱（内环半径14）+ 6 箱体（外环半径22） */
  const obstacles = [];
  const colMat = new THREE.MeshStandardMaterial({ color:0x1A2238, roughness:0.6, metalness:0.7, emissive:0x003344, emissiveIntensity:0.4 });
  const cylGeo = new THREE.CylinderGeometry(0.8, 0.8, 3, 12);
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const m = new THREE.Mesh(cylGeo, colMat);
    m.position.set(Math.cos(a)*14, 1.5, Math.sin(a)*14);
    scene.add(m);
    /* 顶部青色光环 */
    const topRing = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.06, 6, 20), new THREE.MeshBasicMaterial({ color:0x00F0FF }));
    topRing.rotation.x = Math.PI/2; topRing.position.y = 3.02;
    m.add(topRing);
    m.userData.radius = 0.8; m.userData.h = 3;
    obstacles.push(m);
  }
  const boxMat = new THREE.MeshStandardMaterial({ color:0x1A2238, roughness:0.6, metalness:0.7, emissive:0x440022, emissiveIntensity:0.4 });
  const boxGeo = new THREE.BoxGeometry(3, 2, 3);
  const boxAngles = [0.35, 0.95, 1.65, 2.5, 3.4, 4.3];
  for(let i=0;i<6;i++){
    const m = new THREE.Mesh(boxGeo, boxMat);
    const a = boxAngles[i];
    m.position.set(Math.cos(a)*22, 1, Math.sin(a)*22);
    scene.add(m);
    /* 品红警示边 */
    const edge = new THREE.Mesh(new THREE.BoxGeometry(3.05, 0.08, 3.05), new THREE.MeshBasicMaterial({ color:0xFF00E0 }));
    edge.position.y = 2.0; m.add(edge);
    m.userData.radius = 2.0; m.userData.h = 2;
    obstacles.push(m);
  }

  /* 霓虹补光：青/品红/紫 三盏点光（边缘柱顶） */
  const p1 = new THREE.PointLight(0x00F0FF, 1.2, 60); p1.position.set(-20, 6, -20); scene.add(p1);
  const p2 = new THREE.PointLight(0xFF00E0, 1.0, 60); p2.position.set(20, 6, -20); scene.add(p2);
  const p3 = new THREE.PointLight(0x7B2FFF, 0.8, 60); p3.position.set(0, 6, 20); scene.add(p3);

  /* 环境光 + 半球光 + 顶光 */
  scene.add(new THREE.AmbientLight(0x334466, 0.25));
  const hemi = new THREE.HemisphereLight(0x2233AA, 0x0A0E1A, 0.6); scene.add(hemi);
  const dir = new THREE.DirectionalLight(0x88CCFF, 0.6);
  dir.position.set(0, 40, 10); scene.add(dir);

  /* P1: 霓虹光点雨（青/品红双色自上而下，Additive 发光） */
  (function(){
    const COUNT = 460;
    const half = CFG.arena/2 - 2;
    const posA = new Float32Array(COUNT*3);
    const colA = new Float32Array(COUNT*3);
    const vyA  = new Float32Array(COUNT);
    const cCyan = new THREE.Color(0x00F0FF);
    const cMag  = new THREE.Color(0xFF00E0);
    const cWht  = new THREE.Color(0xFFFFFF);
    for(let i=0;i<COUNT;i++){
      posA[i*3]   = (Math.random()*2-1)*half;
      posA[i*3+1] = 1 + Math.random()*17;
      posA[i*3+2] = (Math.random()*2-1)*half;
      const r = Math.random();
      const c = r<0.4 ? cCyan : (r<0.8 ? cMag : cWht);
      colA[i*3]=c.r; colA[i*3+1]=c.g; colA[i*3+2]=c.b;
      vyA[i] = 2.2 + Math.random()*4.5;
    }
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.BufferAttribute(posA,3));
    rg.setAttribute('color', new THREE.BufferAttribute(colA,3));
    const rm = new THREE.PointsMaterial({ size:0.16, vertexColors:true, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false });
    const pts = new THREE.Points(rg, rm);
    scene.add(pts);
    scene.userData.rain = {
      update: function(dt){
        const p = rg.attributes.position.array;
        for(let i=0;i<COUNT;i++){
          p[i*3+1] -= vyA[i]*dt;
          if(p[i*3+1] < 0.25){
            p[i*3]   = (Math.random()*2-1)*half;
            p[i*3+1] = 15 + Math.random()*6;
            p[i*3+2] = (Math.random()*2-1)*half;
          }
        }
        rg.attributes.position.needsUpdate = true;
      }
    };
  })();

  scene.userData.prism = prism;
  scene.userData.obstacles = obstacles;
  return scene;
}
// ===MOD-PLAYER===
function createPlayer(scene, camera){
  const P = {
    pos: new THREE.Vector3(0, CFG.player.eyeH, -20),
    vel: new THREE.Vector3(0,0,0),
    yaw: 0, pitch: 0,
    onGround: true, jumpVel: 0,
    hp: CFG.player.hp, maxHp: CFG.player.hp,
    energy: CFG.rewind.energyMax, maxEnergy: CFG.rewind.energyMax,
    alive: true,
    aiming: false,
    lastShot: 0, firing: false,
    landStunT: 0, hitFlashT: 0, hurtT: 0,
    currentWeapon: 'rifle',
    inventory: { rifle: { mag:30, unlocked:true }, shotgun: { mag:6, unlocked:false }, charger: { mag:4, unlocked:false } },
    reloading: false, reloadT: 0,
    killCount: 0, usedRewind: false,
    bobPhase: 0, bobOffset: 0,
    snapshot: null
  };

  P.applyCamera = function(dt){
    camera.position.copy(this.pos);
    camera.position.y += this.bobOffset;
    const e = new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(e);
  };

  P.update = function(dt, keys, obstacles){
    if(!this.alive) return;

    /* 鼠标视角：在外部 mousemove 处理，这里更新 pitch/yaw */
    /* 移动 */
    const speed = this.aiming ? CFG.player.aimSpeed : CFG.player.speed;
    let fwd=0, right=0;
    if(keys['w']) fwd += 1;
    if(keys['s']) fwd -= 1;
    if(keys['d']) right += 1;
    if(keys['a']) right -= 1;
    const len = Math.hypot(fwd,right);
    if(len>0){ fwd/=len; right/=len; }

    /* 方向向量（yaw 控制） */
    const cosY = Math.cos(this.yaw), sinY = Math.sin(this.yaw);
    const dx = (-sinY*fwd + cosY*right) * speed;
    const dz = (-cosY*fwd - sinY*right) * speed;

    /* 加速度平滑 */
    this.vel.x = damp(this.vel.x, dx, 12, dt);
    this.vel.z = damp(this.vel.z, dz, 12, dt);

    /* 重力 / 跳跃 */
    if(this.onGround && keys[' '] && !this.jumpVel){
      this.jumpVel = Math.sqrt(2 * CFG.player.gravity * CFG.player.jumpH);
      this.onGround = false;
    }
    this.vel.y -= CFG.player.gravity * dt;
    this.pos.y += this.vel.y * dt;

    /* 地面检测 */
    if(this.pos.y <= CFG.player.eyeH){
      if(!this.onGround){ this.landStunT = CFG.player.landStun; }
      this.pos.y = CFG.player.eyeH;
      this.vel.y = 0;
      this.onGround = true;
    }
    if(this.landStunT > 0) this.landStunT -= dt;

    /* 水平移动 + 碰撞 */
    const r = CFG.player.radius;
    let nx = this.pos.x + this.vel.x * dt;
    let nz = this.pos.z + this.vel.z * dt;

    /* 竞技场边界 */
    const lim = CFG.arena/2 - r;
    nx = clamp(nx, -lim, lim);
    nz = clamp(nz, -lim, lim);

    /* 掩体碰撞（圆-圆 / 圆-矩形近似） */
    if(obstacles){
      for(const o of obstacles){
        const ox = o.position.x, oz = o.position.z;
        const orad = o.userData.radius || 1;
        const d = dist2D(nx, nz, ox, oz);
        const minD = r + orad;
        if(d < minD){
          const push = (minD - d) / d;
          nx += (nx - ox) * push;
          nz += (nz - oz) * push;
        }
      }
    }

    this.pos.x = nx;
    this.pos.z = nz;

    /* 视角摇曳（走路晃动） */
    if(len > 0 && this.onGround){
      this.bobPhase += dt * speed * 0.6;
      this.bobOffset = Math.sin(this.bobPhase) * 0.04;
    } else {
      this.bobOffset = damp(this.bobOffset, 0, 10, dt);
    }

    /* 能量被动回复 */
    this.energy = Math.min(this.maxEnergy, this.energy + CFG.rewind.energyRegen * dt);

    /* 受击红闪淡出 */
    if(this.hurtT > 0){ this.hurtT -= dt; if(this.hurtT<=0) document.getElementById('hurt').style.display='none'; }
    if(this.hp < 25) document.getElementById('lowhp').style.display='block';
    else document.getElementById('lowhp').style.display='none';

    /* 顿帧 */
    if(this.hitFlashT > 0) this.hitFlashT -= dt;

    this.applyCamera(dt);
  };

  P.takeDamage = function(dmg){
    if(!this.alive) return;
    this.hp -= dmg;
    this.hurtT = 0.25;
    document.getElementById('hurt').style.display='block';
    if(this.hp <= 0){
      this.hp = 0; this.alive = false;
      /* 临终回溯 */
      if(this.energy >= CFG.rewind.minEnergy && !this.usedRewind){
        /* 自动触发回溯 */
        triggerRewind(true);
      } else {
        onPlayerDeath();
      }
    }
  };

  P.snapshot = function(){
    return {
      pos: vecToArr(this.pos), vel: vecToArr(this.vel),
      yaw: this.yaw, pitch: this.pitch,
      onGround: this.onGround, jumpVel: this.jumpVel,
      hp: this.hp, energy: this.energy,
      currentWeapon: this.currentWeapon,
      inventory: cloneSnap(this.inventory),
      reloading: this.reloading, reloadT: this.reloadT,
      killCount: this.killCount
    };
  };

  P.restore = function(snap){
    vecFromArr(this.pos, snap.pos);
    vecFromArr(this.vel, snap.vel);
    this.yaw = snap.yaw; this.pitch = snap.pitch;
    this.onGround = snap.onGround; this.jumpVel = snap.jumpVel;
    this.hp = snap.hp; this.energy = snap.energy;
    this.currentWeapon = snap.currentWeapon;
    this.inventory = cloneSnap(snap.inventory);
    this.reloading = snap.reloading; this.reloadT = snap.reloadT;
    this.killCount = snap.killCount;
    this.alive = true;
    this.hurtT = 0; document.getElementById('hurt').style.display='none';
    this.applyCamera(0);
  };

  return P;
}

/* 弹道：射线 + 曳光可视化 */
let tracers = [];

function createTracer(scene, from, to, color){
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: color || 0xE0FFFF, transparent:true, opacity:0.9 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  tracers.push({ line, life: 0.09 });
}

function createMuzzleFlash(scene, pos, color){
  const s = 0.4;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ color: color||0xE0FFFF, transparent:true, opacity:0.8 }));
  spr.scale.set(s*3, s*3, 1);
  spr.position.copy(pos);
  scene.add(spr);
  tracers.push({ line: spr, life: 0.05 });
}

function updateTracers(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const t = tracers[i];
    t.life -= dt;
    if(t.life <= 0){
      if(t.line.parent) t.line.parent.remove(t.line);
      if(t.line.geometry) t.line.geometry.dispose();
      if(t.line.material) t.line.material.dispose();
      tracers.splice(i,1);
    }
  }
}

/* 命中特效：火花点 */
const sparks = [];
function spawnSparks(scene, pos, color, n){
  const points = [];
  for(let i=0;i<n;i++){
    points.push(new THREE.Vector3(pos.x + rand(-0.3,0.3), pos.y + rand(-0.3,0.3), pos.z + rand(-0.3,0.3)));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.PointsMaterial({ color: color || 0x00F0FF, size:0.09, transparent:true, opacity:0.9 });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  sparks.push({ pts, life: 0.22 });
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.life -= dt;
    s.pts.material.opacity = s.life/0.22;
    if(s.life <= 0){
      if(s.pts.parent) s.pts.parent.remove(s.pts);
      s.pts.geometry.dispose(); s.pts.material.dispose();
      sparks.splice(i,1);
    }
  }
}

/* 命中判定：从相机中心发射射线 */
function shootRay(scene, player, camera, weapon, spreadDeg){
  const spread = spreadDeg * Math.PI/180;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  /* 随机散布 */
  dir.x += rand(-spread, spread);
  dir.y += rand(-spread, spread);
  dir.z += rand(-spread, spread);
  dir.normalize();

  const origin = camera.position.clone();
  const ray = new THREE.Raycaster(origin, dir, 0.1, 200);
  const enemies = gameState.enemies;
  const targets = enemies.map(e=>e.group);
  const hits = ray.intersectObjects(targets, true);

  createTracer(scene, origin, origin.clone().add(dir.multiplyScalar(40)), 0xE0FFFF);
  createMuzzleFlash(scene, origin.clone().add(dir.clone().multiplyScalar(0.6)), 0xE0FFFF);

  const W = CFG.weapon[weapon];
  if(hits.length > 0){
    const hit = hits[0];
    const enemy = hit.object.userData.enemy;
    if(enemy){
      /* 爆头判定：若命中点是头部子网格 */
      let mult = 1;
      if(hit.object.userData.isHead) mult = 1.5;
      const dmg = W.dmg * mult;
      enemy.takeDamage(dmg, hit.point);
      spawnSparks(scene, hit.point, mult>1 ? 0xFF2D55 : 0x00F0FF, mult>1?14:8);
      /* 命中反馈：准星变红 */
      crosshairHit();
      if(mult>1) addFloater('爆头 ×1.5', true);
    }
  }
}

/* 射击主逻辑 */
function tryFire(){
  const P = player;
  if(!P.alive) return;
  if(P.reloading) return;
  const inv = P.inventory[P.currentWeapon];
  const W = CFG.weapon[P.currentWeapon];
  if(inv.mag <= 0){ startReload(); return; }
  const now = performance.now()/1000;
  if(now - P.lastShot < 1/W.rpm) return;

  P.lastShot = now;
  inv.mag--;

  const pellets = W.pellet || 1;
  for(let i=0;i<pellets;i++){
    shootRay(scene, P, camera, P.currentWeapon, W.spread);
  }
  /* 准星扩散：连射增大 */
  crosshairSpread += 0.6;
  crosshairSpread = Math.min(crosshairSpread, 10);

  if(inv.mag <= 0) startReload();
}

/* 换弹 */
function startReload(){
  const P = player;
  if(P.reloading) return;
  const W = CFG.weapon[P.currentWeapon];
  const inv = P.inventory[P.currentWeapon];
  if(inv.mag >= W.mag) return;
  P.reloading = true;
  P.reloadT = W.reload;
}

function updateReload(dt){
  const P = player;
  if(!P.reloading) return;
  P.reloadT -= dt;
  if(P.reloadT <= 0){
    P.reloading = false;
    const W = CFG.weapon[P.currentWeapon];
    P.inventory[P.currentWeapon].mag = W.mag;
    addFloater('装填完毕', false);
  }
}

/* 切换武器 */
function switchWeapon(w){
  const P = player;
  if(!P.inventory[w] || !P.inventory[w].unlocked) return;
  if(P.reloading) return; /* 换弹中不可切换(简化) */
  P.currentWeapon = w;
  P.lastShot = 0;
  addFloater(CFG.weapon[w].name, false);
}

function registerGLTFLoader(){

function createEnemyMesh(type, cfg){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color:0x2A3040, roughness:0.6, metalness:0.7, emissive:cfg.color, emissiveIntensity:0.35 });
  const glowMat = new THREE.MeshBasicMaterial({ color:cfg.color });

  if(type==='E1' || type==='E3'){
    /* 球体+小眼睛：游荡者/冲锋者 */
    const body = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.45, 10, 8), bodyMat);
    body.position.y = cfg.size*0.55;
    body.userData.isHead = false;
    g.add(body);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.18, 8, 6), glowMat);
    eye.position.set(cfg.size*0.3, cfg.size*0.7, cfg.size*0.35);
    g.add(eye);
    /* 腹部能量核 */
    const core = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.22, 8, 6), glowMat);
    core.position.set(0, cfg.size*0.4, 0);
    g.add(core);
    g.userData.hitMeshes = [body, eye, core];
    g.userData.headMeshes = [eye];
    if(type==='E3'){
      /* 冲锋者加尖刺 */
      const spike = new THREE.Mesh(new THREE.ConeGeometry(cfg.size*0.15, cfg.size*0.5, 6), bodyMat);
      spike.position.set(0, cfg.size*0.9, 0);
      g.add(spike);
    }
  }
  else if(type==='E2'){
    /* 悬浮三角信标：射手 */
    const body = new THREE.Mesh(new THREE.ConeGeometry(cfg.size*0.5, cfg.size*1.2, 4), bodyMat);
    body.position.y = cfg.size*0.8;
    g.add(body);
    const lense = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.2, 8, 6), glowMat);
    lense.position.set(0, cfg.size*0.85, cfg.size*0.35);
    g.add(lense);
    g.userData.hitMeshes = [body, lense];
    g.userData.headMeshes = [lense];
  }
  else if(type==='E4'){
    /* 重型机甲：宽体箱+双肩 */
    const body = new THREE.Mesh(new THREE.BoxGeometry(cfg.size*0.9, cfg.size*0.9, cfg.size*0.7), bodyMat);
    body.position.y = cfg.size*0.55;
    g.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(cfg.size*0.4, cfg.size*0.4, cfg.size*0.4), bodyMat);
    head.position.y = cfg.size*1.15;
    g.add(head);
    const eye = new THREE.Mesh(new THREE.BoxGeometry(cfg.size*0.5, cfg.size*0.12, cfg.size*0.1), glowMat);
    eye.position.set(0, cfg.size*1.15, cfg.size*0.21);
    g.add(eye);
    const s1 = new THREE.Mesh(new THREE.BoxGeometry(cfg.size*0.3, cfg.size*0.6, cfg.size*0.5), glowMat);
    s1.position.set(cfg.size*0.55, cfg.size*0.8, 0);
    g.add(s1);
    const s2 = s1.clone(); s2.position.x = -cfg.size*0.55; g.add(s2);
    g.userData.hitMeshes = [body, head, eye, s1, s2];
    g.userData.headMeshes = [head];
  }
  else if(type==='E5'){
    /* 爆裂者：闪烁红球 + 警示环 */
    const body = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.5, 10, 8), bodyMat);
    body.position.y = cfg.size*0.6;
    g.add(body);
    const core = new THREE.Mesh(new THREE.SphereGeometry(cfg.size*0.3, 10, 8), glowMat);
    core.position.y = cfg.size*0.6;
    g.add(core);
    const ringM = new THREE.Mesh(new THREE.TorusGeometry(cfg.size*0.65, 0.05, 6, 20), glowMat);
    ringM.position.y = cfg.size*0.6; ringM.rotation.x = Math.PI/2;
    g.add(ringM);
    g.userData.ring = ringM;
    g.userData.hitMeshes = [body, core, ringM];
    g.userData.headMeshes = [core];
  }
  else if(type==='E6'){
    /* 精英哨兵：高大发光体 + 三棱镜 + 品红光环（区别于普通敌人） */
    const body = new THREE.Mesh(new THREE.ConeGeometry(cfg.size*0.45, cfg.size*1.6, 3), bodyMat);
    body.position.y = cfg.size*0.8;
    g.add(body);
    const prism = new THREE.Mesh(new THREE.OctahedronGeometry(cfg.size*0.4, 0), glowMat);
    prism.position.y = cfg.size*1.7;
    g.add(prism);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(cfg.size*0.7, 0.06, 6, 24), glowMat);
    halo.position.y = cfg.size*0.85; halo.rotation.x = Math.PI/2;
    g.add(halo);
    g.userData.halo = halo;
    g.userData.hitMeshes = [body, prism, halo];
    g.userData.headMeshes = [prism];
  }
  else {
    const body = new THREE.Mesh(new THREE.BoxGeometry(cfg.size, cfg.size, cfg.size), bodyMat);
    g.add(body);
    g.userData.hitMeshes = [body];
    g.userData.headMeshes = [];
  }

  /* 标记命中网格所属敌人 */
  g.userData.hitMeshes.forEach(m=>{ m.userData.enemy = null; m.userData.isHead = false; });
  g.userData.headMeshes.forEach(m=>{ m.userData.isHead = true; });

  return g;
}

/* 敌人实体 */
function createEnemy(type, spawnPos, scene){
  const cfg = CFG.enemy[type];
  const mesh = createEnemyMesh(type, cfg);
  mesh.position.copy(spawnPos);
  mesh.userData.enemy = null;
  scene.add(mesh);

  /* 血条锚点（Sprite，简化为头顶小条） */
  const barBg = document.createElement('canvas');
  barBg.width = 64; barBg.height = 6;
  const ctx = barBg.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,64,6);
  const barTex = new THREE.CanvasTexture(barBg);
  const barMat = new THREE.SpriteMaterial({ map:barTex, depthTest:false });
  const bar = new THREE.Sprite(barMat);
  bar.scale.set(1.2, 0.12, 1);
  bar.position.y = 2.4 + (cfg.size||1);
  mesh.add(bar);
  mesh.userData.hpBar = bar;
  mesh.userData.hpBarCtx = ctx;
  mesh.userData.hpBarTex = barTex;

  const E = {
    type, cfg, mesh, hp: cfg.hp, maxHp: cfg.hp,
    speed: cfg.speed, pos: spawnPos.clone(),
    state: 'approach', /* approach / attack / retreat */
    attackCd: rand(0.3, cfg.cd), 
    flashT: 0, alive: true,
    nextWay: 0, wanderT: 0,
    burstLeft: 0, burstTimer: 0
  };
  mesh.userData.enemy = E;

  E.update = function(dt, player, scene, enemies){
    if(!this.alive) return;
    this.attackCd -= dt;
    if(this.flashT > 0){
      this.flashT -= dt;
      if(this.flashT <= 0) this.setEmit(0.35);
    }

    /* 浮游微动 */
    if(this.type==='E1'||this.type==='E2'){
      this.mesh.position.y = this.pos.y + Math.sin(performance.now()/300 + this.pos.x)*0.15 + 0.3;
    }

    const dx = player.pos.x - this.pos.x;
    const dz = player.pos.z - this.pos.z;
    const dist = Math.hypot(dx, dz);

    /* 面向玩家 */
    this.mesh.lookAt(player.pos.x, this.mesh.position.y, player.pos.z);

    /* 行为分派 */
    if(this.type==='E2' || this.type==='E6'){
      /* 远程：保持距离，够远接近，够近射击 */
      if(dist > (this.cfg.ranged? this.cfg.range : 8)){
        this.moveToward(player, dt);
      } else if(dist < this.cfg.range * 0.55){
        /* 过近则后退 */
        this.moveAway(player, dt);
      } else {
        this.state = 'attack';
        if(this.attackCd <= 0){
          this.fireProjectile(scene, player);
          this.attackCd = this.cfg.cd;
        }
      }
    }
    else {
      /* 近战：直接接近，到范围攻击 */
      if(dist > this.cfg.range){
        this.moveToward(player, dt);
        this.state = 'approach';
      } else {
        this.state = 'attack';
        if(this.attackCd <= 0 && this.cfg.melee){
          this.meleeAttack(player);
          this.attackCd = this.cfg.cd;
        }
      }
    }

    /* 自爆者：接近后自爆 AOE */
    if(this.type==='E5'){
      if(dist < this.cfg.range){
/* E6 elite burst: fire remaining pellets at 0.25s interval */
      if(this.type==='E6' && this.burstLeft > 0){
        this.burstTimer -= dt;
        if(this.burstTimer <= 0){
          const from6 = this.mesh.position.clone(); from6.y += 1.2;
          const to6 = player.pos.clone(); to6.y += 0.8;
          const dir6 = to6.sub(from6).normalize();
          projectiles.push(createProjectile(this, from6, dir6, scene));
          this.burstLeft--;
          this.burstTimer = 0.25;
        }
      }
      this.explode(scene, player, enemies);
        this.explode(scene, player, enemies);
      }
      /* 闪烁警示 */
      if(this.mesh.userData.ring){
        const s = 1 + Math.sin(performance.now()/80)*0.25;
        this.mesh.userData.ring.scale.set(s,s,1);
      }
    }
  };

  E.moveToward = function(player, dt){
    const dx = player.pos.x - this.pos.x;
    const dz = player.pos.z - this.pos.z;
    const d = Math.hypot(dx,dz) || 1;
    this.pos.x += dx/d * this.speed * dt;
    this.pos.z += dz/d * this.speed * dt;
    this.mesh.position.x = this.pos.x;
    this.mesh.position.z = this.pos.z;
  };
  E.moveAway = function(player, dt){
    const dx = this.pos.x - player.pos.x;
    const dz = this.pos.z - player.pos.z;
    const d = Math.hypot(dx,dz) || 1;
    this.pos.x += dx/d * this.speed * 0.7 * dt;
    this.pos.z += dz/d * this.speed * 0.7 * dt;
    this.mesh.position.x = this.pos.x;
    this.mesh.position.z = this.pos.z;
  };

  E.setEmit = function(v){
    this.mesh.userData.hitMeshes.forEach(m=>{
      if(m.material && m.material.emissiveIntensity !== undefined) m.material.emissiveIntensity = v;
    });
  };

  E.takeDamage = function(dmg, hitPoint){
    if(!this.alive) return;
    this.hp -= dmg;
    this.flashT = 0.1;
    this.setEmit(2.0); /* 受击闪白 */
    this.updateBar();
    if(this.hp <= 0) this.die(scene);
  };

  E.updateBar = function(){
    const pct = clamp(this.hp/this.maxHp, 0, 1);
    const ctx = this.mesh.userData.hpBarCtx;
    if(!ctx) return;
    ctx.clearRect(0,0,64,6);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,64,6);
    ctx.fillStyle = '#00F0FF';
    ctx.fillRect(0,0, Math.floor(62*pct), 6);
    this.mesh.userData.hpBarTex.needsUpdate = true;
  };

  E.meleeAttack = function(player){
    player.takeDamage(this.cfg.atk);
  };

  E.fireProjectile = function(scene, player){
    const from = this.mesh.position.clone();
    from.y += 1.2;
    const to = player.pos.clone();
    to.y += 0.8;
    const dir = to.sub(from).normalize();
    /* 精英连发 */
    if(this.type==='E6'){
      this.burstLeft = 3;
      this.burstTimer = 0.25;
      const pr = createProjectile(this, from, dir, scene);
      projectiles.push(pr);
      this.burstLeft--;
    } else {
      const pr = createProjectile(this, from, dir, scene);
      projectiles.push(pr);
    }
  };

  E.explode = function(scene, player, enemies){
    if(!this.alive) return;
    /* 对玩家 AOE */
    const d = dist2D(this.pos.x, this.pos.z, player.pos.x, player.pos.z);
    if(d < this.cfg.boomRadius) player.takeDamage(this.cfg.atk);
    /* 对自己也死（自爆） */
    this.die(scene, true);
    spawnSparks(scene, this.mesh.position.clone(), 0xFF2D55, 20);
  };

  E.die = function(scene, isBoom){
    if(!this.alive) return;
    this.alive = false;
    this.mesh.userData.enemy = null;
    scene.remove(this.mesh);
    /* 击杀奖励能量 */
    if(this.type==='E5'){ player.energy = Math.min(player.maxEnergy, player.energy + CFG.rewind.bomberEnergy); }
    else { player.energy = Math.min(player.maxEnergy, player.energy + CFG.rewind.energyKill); }
    player.killCount++;
    /* 精英掉落 40 能量包 */
    if(this.type==='E6'){
      player.energy = Math.min(player.maxEnergy, player.energy + CFG.rewind.elitePack);
      addFloater('+40 能量包', true);
      /* 解锁蓄能炮 */
      player.inventory.charger.unlocked = true;
      addFloater('蓄能炮已解锁!', true);
      showBanner('⚠ 精英哨兵被消灭', true);
    } else {
      addFloater('+5 ENERGY', false);
    }
    spawnSparks(scene, this.mesh.position.clone(), this.cfg.color, 20);
    gameState.enemies = gameState.enemies.filter(e=>e!==this);
    /* 波次检测 */
    checkWaveClear();
  };

  E.snapshot = function(){
    return {
      type: this.type, hp: this.hp,
      pos: vecToArr(this.pos),
      state: this.state, attackCd: this.attackCd,
      burstLeft: this.burstLeft, burstTimer: this.burstTimer
    };
  };

  return E;
}

/* 敌弹 */
let projectiles = [];
function createProjectile(owner, from, dir, scene){
  const color = owner.type==='E6' ? 0xFF00E0 : 0xFF2D55;
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 6, 6),
    new THREE.MeshBasicMaterial({ color })
  );
  glow.position.copy(from);
  scene.add(glow);
  const pr = {
    mesh: glow, owner, pos: from.clone(), dir: dir.clone(),
    speed: owner.cfg.projSpeed || 18,
    life: 3
  };
  return pr;
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const pr = projectiles[i];
    pr.life -= dt;
    pr.pos.add(pr.dir.clone().multiplyScalar(pr.speed * dt));
    pr.mesh.position.copy(pr.pos);
    if(pr.life <= 0){
      if(pr.mesh.parent) pr.mesh.parent.remove(pr.mesh);
      projectiles.splice(i,1);
      continue;
    }
    /* 命中玩家 */
    const d = dist2D(pr.pos.x, pr.pos.z, player.pos.x, player.pos.z);
    if(d < 0.8 && pr.pos.y > 0.3 && pr.pos.y < 2.5 && player.alive){
      player.takeDamage(pr.owner.cfg.atk);
      if(pr.mesh.parent) pr.mesh.parent.remove(pr.mesh);
      projectiles.splice(i,1);
    }
  }
}
function clearProjectiles(){
  projectiles.forEach(p=>{ if(p.mesh.parent) p.mesh.parent.remove(p.mesh); });
  projectiles = [];
}
// ===MOD-REWIND===
/* 快照系统：保留最近 REWIND_BUFFER 秒的状态，用于回溯 */
const REWIND_BUFFER = 3.0;   /* 秒 */
const SNAP_INTERVAL = 0.05;  /* 20Hz 采样 */
let snapHistory = [];
let snapAccum = 0;
let rewinding = false;       /* 演出中 */
let rewindT = 0;
let lastSnapshot = null;

/* 记录一帧快照 */
function recordSnapshot(){
  if(rewinding) return;
  const snap = {
    t: performance.now()/1000,
    player: player ? player.snapshot() : null,
    enemies: gameState.enemies.map(e=>e.snapshot()),
    projectiles: projectiles.map(p=>({
      pos: vecToArr(p.pos), dir: vecToArr(p.dir),
      life: p.life, type: p.owner.type,
      speed: p.speed
    }))
  };
  snapHistory.push(snap);
  /* 只保留 3 秒 */
  const now = snap.t;
  while(snapHistory.length > 2 && (now - snapHistory[0].t) > REWIND_BUFFER){
    snapHistory.shift();
  }
}

/* 获取 3 秒前的快照（回溯目标） */
function getRewindTarget(){
  if(snapHistory.length < 2) return null;
  const now = performance.now()/1000;
  /* 找距离 now-3s 最近的帧 */
  const target = now - REWIND_BUFFER;
  let best = snapHistory[0];
  for(const s of snapHistory){
    if(Math.abs(s.t - target) < Math.abs(best.t - target)) best = s;
  }
  return best;
}

/* 触发回溯（isDeath 表示临终自动回溯） */
function triggerRewind(isDeath){
  if(rewinding) return;
  const P = player;
  if(!P || !P.alive) return;
  /* 换弹中不可回溯（04 文档 4.2：按 Q 会打断换弹但不消耗能量） */
  const target = getRewindTarget();
  if(!target){ addFloater('没有可回退的锚点', false); return; }

  if(P.energy < CFG.rewind.minEnergy){
    addFloater('时间眩晕——冷却中', true);
    return;
  }

  /* 消耗能量 */
  P.energy -= CFG.rewind.cost;
  P.usedRewind = true;
  /* 打断换弹（不消耗能量、不重置进度） */
  P.reloading = false;

  /* 演出 */
  rewinding = true;
rewinding = true;
  spawnRewindFX();
  rewindT = CFG.rewind.show; /* 0.6s */
  document.getElementById('rewind').style.display = 'flex';
  lastSnapshot = target;

  if(isDeath){ P.alive = true; document.getElementById('dead').style.display='none'; }
}

/* 回溯恢复（快照回退） */
function applyRewindSnapshot(snap){
  /* 玩家 */
  if(snap.player && player) player.restore(snap.player);
  /* 敌人：先移除现有，再按快照重建 */
  const scene = gameState.scene;
  gameState.enemies.forEach(e=>{
    if(e.mesh.parent) scene.remove(e.mesh);
  });
  gameState.enemies = [];
  snap.enemies.forEach(es=>{
    const cfg = CFG.enemy[es.type];
    const E = createEnemy(es.type, new THREE.Vector3(es.pos[0], es.pos[1], es.pos[2]), scene);
    E.hp = es.hp;
    E.maxHp = cfg.hp;
    E.state = es.state || 'approach';
    E.attackCd = es.attackCd || 0;
    E.burstLeft = es.burstLeft || 0;
    E.burstTimer = es.burstTimer || 0;
    E.updateBar();
    gameState.enemies.push(E);
  });
  /* 弹道 */
  clearProjectiles();
  snap.projectiles.forEach(ps=>{
    const from = new THREE.Vector3(ps.pos[0], ps.pos[1], ps.pos[2]);
    const dir = new THREE.Vector3(ps.dir[0], ps.dir[1], ps.dir[2]);
    /* 重建弹道（用最近类型敌人的配置） */
    const cfg = CFG.enemy[ps.type] || CFG.enemy.E2;
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 6, 6),
      new THREE.MeshBasicMaterial({ color: ps.type==='E6' ? 0xFF00E0 : 0xFF2D55 })
    );
    glow.position.copy(from);
    scene.add(glow);
    projectiles.push({ mesh:glow, owner:{cfg, atk:cfg.atk}, pos:from.clone(), dir, speed:ps.speed||cfg.projSpeed, life:ps.life });
  });
  /* 重置 HUD 动态元素 */
  document.getElementById('hurt').style.display='none';
  document.getElementById('lowhp').style.display = player.hp<25 ? 'block' : 'none';
}

/* 回溯演出更新 */
/* P1: 回溯演出强化 - 粒子倒流 + 时间残影 */
let rewindFX = { active:false, t:0, particles:[], ghosts:[] };
function spawnRewindFX(){
  rewindFX.particles.forEach(p=>{ if(p.mesh.parent) scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); });
  rewindFX.ghosts.forEach(g=>{ if(g.parent) scene.remove(g); });
  rewindFX.particles = []; rewindFX.ghosts = [];
  rewindFX.active = true; rewindFX.t = CFG.rewind.show;
  const P = player;
  if(!P) return;
  for(let i=0;i<60;i++){
    const size = 0.08 + Math.random()*0.08;
    const m = new THREE.Mesh(
      new THREE.OctahedronGeometry(size, 0),
      new THREE.MeshBasicMaterial({ color:0x00F0FF, transparent:true, opacity:0.9 })
    );
    const a = Math.random()*Math.PI*2;
    const r = 1.5 + Math.random()*5;
    m.position.set(
      P.pos.x + Math.cos(a)*r,
      P.pos.y + (Math.random()*2-1)*r*0.7,
      P.pos.z + Math.sin(a)*r
    );
    scene.add(m);
    rewindFX.particles.push({ mesh:m, delay:Math.random()*0.35 });
  }
  gameState.enemies.forEach(e=>{
    if(!e.alive || !e.mesh) return;
    const ghost = e.mesh.clone();
    ghost.traverse(o=>{
      if(o.isMesh){
        o.material = new THREE.MeshBasicMaterial({ color:0x00F0FF, transparent:true, opacity:0.35 });
      }
    });
    ghost.position.copy(e.mesh.position);
    ghost.rotation.copy(e.mesh.rotation);
    scene.add(ghost);
    rewindFX.ghosts.push(ghost);
  });
}
function updateRewindFX(dt){
  if(!rewindFX.active) return;
  rewindFX.t -= dt;
  const P = player;
  if(P){
    rewindFX.particles.forEach(p=>{
      p.delay -= dt;
      if(p.delay <= 0) p.mesh.position.lerp(P.pos, dt*6);
    });
  }
  rewindFX.ghosts.forEach(g=>{
    g.traverse(o=>{ if(o.isMesh && o.material.opacity !== undefined){ o.material.opacity -= dt*1.6; } });
  });
  if(rewindFX.t <= 0){
    rewindFX.active = false;
    rewindFX.particles.forEach(p=>{ if(p.mesh.parent) scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); });
    rewindFX.ghosts.forEach(g=>{ if(g.parent) scene.remove(g); });
    rewindFX.particles = []; rewindFX.ghosts = [];
  }
}
function updateRewind(dt){
  if(!rewinding) return;
  rewindT -= dt;
rewindT -= dt;
  updateRewindFX(dt);
  document.getElementById('rewindClock').textContent = '+' + Math.max(0, rewindT).toFixed(1) + 's';
  if(rewindT <= 0){
    /* 演出结束，应用快照 */
    if(lastSnapshot) applyRewindSnapshot(lastSnapshot);
    rewinding = false;
    document.getElementById('rewind').style.display = 'none';
    lastSnapshot = null;
    addFloater('时间已回卷 3 秒', true);
  }
}
// ===MOD-WAVE===
/* 波次管理 */
const waveState = {
  wave: 0,              /* 当前波（1 起） */
  phase: 'intermission',/* intermission / spawning / fighting / cleared */
  spawnQueue: [],       /* 待生成敌人 [type,...] */
  spawnTimer: 0,
  batchTimer: 0,
  batchCounter: 0,
  totalEnemies: 0,
  initialTotal: 0
};

/* 生成一波的敌人构成（含无尽延伸规则） */
function buildWaveComposition(w){
  if(w <= 8) return cloneSnap(CFG.waves[w-1]);
  /* 无尽模式：构成按 E1~E5 轮转 + 每 5 波 1 精英 */
  const comp = {};
  const base = cloneSnap(CFG.waves[((w-9) % 8)]); /* 8 波轮转 */
  /* 血量倍率：每波 ×1.18 */
  const scale = Math.pow(1.18, w-8);
  for(const k in base){
    comp[k] = Math.max(1, Math.round(base[k] * scale));
  }
  if(w % 5 === 0) comp.E6 = (comp.E6||0) + 1;
  return comp;
}

/* 计算一波总血量（用于显示/无尽难度） */
function waveTotalHP(comp){
  let total = 0;
  for(const k in comp){
    if(CFG.enemy[k]) total += comp[k] * CFG.enemy[k].hp;
  }
  return total;
}

/* 开始新一波 */
function startWave(w){
  waveState.wave = w;
  const comp = buildWaveComposition(w);
  /* 生成队列：全部敌人 */
  const queue = [];
  for(const k in comp){
    for(let i=0;i<comp[k];i++) queue.push(k);
  }
  /* 打乱 */
  for(let i=queue.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [queue[i], queue[j]] = [queue[j], queue[i]];
  }
  /* 分 2 批 */
  waveState.spawnQueue = queue;
  waveState.totalEnemies = queue.length;
  waveState.initialTotal = queue.length;
  waveState.batchCounter = 0;
  waveState.spawnTimer = 0;
  waveState.batchTimer = 0;
  waveState.phase = 'spawning';

  /* UI */
  const isElite = comp.E6 > 0;
  const line = w <= 8 ? WAVE_LINES[w-1] : (`无尽演武 · 第 ${w} 层`);
  const name = w <= 8 ? WAVE_NAMES[w-1] : '无尽深渊';
  document.getElementById('waveLabel').textContent = `WAVE ${w}/8 · ${name}`;
  document.getElementById('remain').textContent = waveState.initialTotal;
  showBanner(`${isElite?'⚠ ':''}WAVE ${w} · ${name}`, isElite);
  setTimeout(()=>{ showBanner(line, false); }, 900);
}

/* 生成一个敌人：从随机刷点 */
function spawnEnemy(type){
  const scene = gameState.scene;
  const sp = CFG.spawnPoints[Math.floor(Math.random()*CFG.spawnPoints.length)];
  const pos = new THREE.Vector3(sp[0], 0.3, sp[2]);
  const E = createEnemy(type, pos, scene);
  gameState.enemies.push(E);
}

/* 波次更细的更新 */
function updateWave(dt){
  const ws = waveState;
  if(ws.phase === 'intermission'){
    ws.spawnTimer -= dt;
    if(ws.spawnTimer <= 0){
      startWave(ws.wave + 1);
    }
    return;
  }
  if(ws.phase === 'spawning'){
    ws.spawnTimer -= dt;
    ws.batchTimer -= dt;
    if(ws.spawnTimer <= 0){
      /* 每帧生成一个，直至本批 50% */
      const half = Math.ceil(ws.initialTotal/2);
      if(ws.batchCounter < half && ws.spawnQueue.length > 0){
        spawnEnemy(ws.spawnQueue.shift());
        ws.batchCounter++;
        ws.spawnTimer = 0.5; /* 250ms 一个 */
      }
      if(ws.batchCounter >= half){
        /* 本批完成，等待 10s 后第二批 */
        if(ws.batchTimer <= 0){
          ws.batchTimer = 10;
        }
        if(ws.batchTimer <= 0){
          ws.phase = 'fighting';
          ws.spawnTimer = 0;
        }
      }
    }
    /* 更新剩余显示 */
    document.getElementById('remain').textContent = ws.spawnQueue.length + gameState.enemies.length;
    return;
  }
  if(ws.phase === 'fighting'){
    /* 无操作，等敌人清零（checkWaveClear 触发） */
    return;
  }
}

/* 敌人清零后检测 */
function checkWaveClear(){
  const ws = waveState;
  if(ws.phase !== 'fighting' && ws.phase !== 'spawning') return;
  /* 若队列还有未生成或场上还有敌人，不结算 */
  if(ws.spawnQueue.length > 0 || gameState.enemies.length > 0) return;
  /* 波次结束 */
  ws.phase = 'intermission';
  ws.spawnTimer = 8; /* 8 秒休息 */
  const w = ws.wave;

  if(w >= 8){
    /* 通关结算 */
    gameState.over = true;
    onGameWin();
    return;
  }

  /* 奖励：能量 +25、弹药半补 */
  player.energy = Math.min(player.maxEnergy, player.energy + CFG.rewind.energyWave);
  for(const key in player.inventory){
    if(player.inventory[key].unlocked){
      player.inventory[key].mag = Math.min(CFG.weapon[key].mag, player.inventory[key].mag + Math.floor(CFG.weapon[key].mag/2));
    }
  }
  addFloater('波次奖励 +25 能量', true);
  const lines = ['回声区平静了……暂时。','商会记账中：又少了一批废铁。'];
  showBanner(lines[Math.floor(Math.random()*lines.length)], false);
}
// ===MOD-HUD===
/* 准星扩散管理 */
let crosshairSpread = 0;

function updateHUD(dt){
  const P = player;
  if(!P) return;
  /* 血量条 */
  const hpFill = document.getElementById('hpFill');
  const hpPct = P.hp / P.maxHp;
  hpFill.style.width = (hpPct*100) + '%';
  hpFill.className = 'fill' + (P.hp < 25 ? ' low' : '');
  document.getElementById('hpNum').textContent = Math.ceil(P.hp);

  /* 能量条 */
  const enFill = document.getElementById('enFill');
  const enPct = P.energy / P.maxEnergy;
  enFill.style.width = (enPct*100) + '%';
  enFill.className = 'fill' + (P.energy < CFG.rewind.minEnergy ? ' gray' : '');
  document.getElementById('enNum').textContent = Math.ceil(P.energy);

  /* 武器栏 */
  const wdiv = document.getElementById('weapons');
  wdiv.innerHTML = '';
  for(const key of ['rifle','shotgun','charger']){
    const inv = P.inventory[key];
    if(!inv.unlocked) continue;
    const W = CFG.weapon[key];
    const slot = document.createElement('div');
    slot.className = 'wslot' + (P.currentWeapon===key ? ' active' : '');
    const lowAmmo = inv.mag <= Math.ceil(W.mag * 0.25);
    slot.innerHTML = `${W.name} <span class="ammo${lowAmmo?' low':''}">${inv.mag}/${W.mag}</span>`;
    wdiv.appendChild(slot);
  }

  /* 击杀数 */
  document.getElementById('kills').textContent = '击杀 ' + P.killCount;

  /* 换弹进度（简化为文字） */
  /* 准星扩散衰减 */
  crosshairSpread = damp(crosshairSpread, 0, 8, dt);
  updateCrosshairVisual();

  /* 剩余敌人 */
  const ws = waveState;
  const remain = ws.spawnQueue.length + gameState.enemies.length;
  document.getElementById('remain').textContent = remain;
}

/* 准星视觉更新（动态扩散） */
function updateCrosshairVisual(){
  const ch = document.getElementById('crosshair');
  const s = 1 + crosshairSpread * 0.12;
  ch.style.transform = 'scale(' + s + ')';
}

/* 命中反馈 */
let crosshairHitT = 0;
function crosshairHit(){
  const ch = document.getElementById('crosshair');
  ch.className = 'hit';
  crosshairHitT = 0.12;
}
function updateCrosshairHit(dt){
  if(crosshairHitT > 0){
    crosshairHitT -= dt;
    if(crosshairHitT <= 0) document.getElementById('crosshair').className = '';
  }
}

/* 玩家死亡 */
function onPlayerDeath(){
  document.getElementById('dead').style.display = 'block';
  /* 延迟后显示结算 */
  setTimeout(()=>{
    const txt = END_LINES.death.join('\n');
    showEndPanel('时间线终止', txt, `第 ${waveState.wave} 波 · 击杀 ${player.killCount}`);
  }, 600);
}

/* 通关 */
function onGameWin(){
  const txt = END_LINES.win.join('\n') + '\n（暗线）他们给你的三秒，是偷来的。';
  showEndPanel('债务清偿', txt, `全 8 波 · 击杀 ${player.killCount}`);
}

/* 结算面板 */
function showEndPanel(title, txt, stat){
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endTxt').textContent = txt;
  document.getElementById('endStat').textContent = stat;
  document.getElementById('endpanel').style.display = 'flex';
}
// ===MOD-MENU===
/* 信用记录页：彩蛋（显示 KAI 债务） */
let ledgerShown = false;

function bindMenu(){
  document.getElementById('btnStart').addEventListener('click', ()=>{
    hideMenu();
    startGame();
  });
  document.getElementById('btnControls').addEventListener('click', ()=>{
    document.getElementById('controls').style.display = 'flex';
  });
  document.getElementById('btnBack').addEventListener('click', ()=>{
    document.getElementById('controls').style.display = 'none';
  });
  document.getElementById('btnLedger').addEventListener('click', ()=>{
    showLedger();
  });
  document.getElementById('btnResume').addEventListener('click', ()=>{
    document.getElementById('pause').style.display = 'none';
    gameState.paused = false;
  });
  document.getElementById('btnQuit').addEventListener('click', ()=>{
    document.getElementById('pause').style.display = 'none';
    gameState.paused = false;
    backToMenu();
  });
  document.getElementById('btnRetry').addEventListener('click', ()=>{
    document.getElementById('endpanel').style.display = 'none';
    startGame();
  });
  document.getElementById('btnMenu').addEventListener('click', ()=>{
    document.getElementById('endpanel').style.display = 'none';
    backToMenu();
  });
}

function showLedger(){
  const txt = `KAI 的信用记录\n\n债务：37,000 CR\n已还：${player && player.killCount ? (player.killCount*250) : 0} CR\n\n时之商会提醒：\n利息以秒计算。`;
  showEndPanel('信用记录 LEDGER', txt, 'TIME DEBT NEVER EXPIRES');
  /* 隐藏结算按钮，只显示返回 */
  document.getElementById('btnRetry').style.display = 'none';
  document.getElementById('btnMenu').textContent = '返回 RETURN';
}

function hideMenu(){
  document.getElementById('menu').style.display = 'none';
}
function backToMenu(){
  /* 重置游戏状态 */
  resetGame();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  document.getElementById('btnRetry').style.display = '';
  document.getElementById('btnMenu').textContent = '主菜单 MENU';
}

/* 开场简报（第一波前） */
function showIntro(){
  showEndPanel('裂隙竞技场 · 第 09 区', INTRO_TEXT, '塔台时间 22:00');
  document.getElementById('btnRetry').textContent = '进入演武 ENTER';
  document.getElementById('btnMenu').textContent = '返回 RETURN';
}
// ===MOD-MAIN===
/* 渲染器 */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);
/* P1: 后处理管线（UnrealBloomPass 霓虹发光） */
let composer = null;
let bloomPass = null;
function initPostFX(){
  try{
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85,      /* strength: 发光强度 */
      0.7,       /* radius: 弥散半径 */
      0.6        /* threshold: 亮度阈值 */
    );
    composer.addPass(bloomPass);
    window.__bloomOK = true;
  }catch(e){
    console.warn('Bloom init failed, fallback to direct render:', e);
    composer = null;
    window.__bloomOK = false;
  }
}
function renderFrame(){
  if(composer && window.__bloomOK){
    composer.render();
  }else{
    renderer.render(scene, camera);
  }
}

const scene = buildScene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
const gameState = { scene, enemies: [], over:false, paused:false, started:false, time:0 };

/* 玩家 */
let player = null;

/* 输入 */
const keys = {};
const mouse = { dx:0, dy:0, locked:false };

/* 武器外观（枪口位置）：简化用相机位置即可 */

function resetGame(){
  /* 清空敌人 */
  gameState.enemies.forEach(e=>{ if(e.mesh.parent) scene.remove(e.mesh); });
  gameState.enemies = [];
  clearProjectiles();
  /* 清空快照 */
  snapHistory = [];
  snapAccum = 0;
  rewinding = false;
  rewindT = 0;
  lastSnapshot = null;
  document.getElementById('rewind').style.display = 'none';
  document.getElementById('hurt').style.display = 'none';
  document.getElementById('lowhp').style.display = 'none';
  document.getElementById('dead').style.display = 'none';
  document.getElementById('floaters').innerHTML = '';
  /* 重建玩家 */
  player = createPlayer(scene, camera);
  player.applyCamera(0);
  /* 波次 */
  waveState.wave = 0;
  waveState.phase = 'intermission';
  waveState.spawnTimer = 0.5;
  waveState.spawnQueue = [];
  waveState.totalEnemies = 0;
  waveState.initialTotal = 0;
  waveState.batchCounter = 0;
  gameState.over = false;
  gameState.time = 0;
  gameState.started = true;
  document.getElementById('hud').style.display = 'block';
  document.getElementById('waveLabel').textContent = 'WAVE 1/8';
  document.getElementById('remain').textContent = '0';
  document.getElementById('kills').textContent = '击杀 0';
  crosshairSpread = 0;
}

function startGame(){
  resetGame();
  /* 镜头归位 */
  camera.position.set(player.pos.x, player.pos.y, player.pos.z);
  if(document.pointerLockElement !== renderer.domElement){
    renderer.domElement.requestPointerLock();
  }
}

/* 输入事件 */
document.addEventListener('mousemove', (e)=>{
  if(!gameState.started || gameState.paused) return;
  if(document.pointerLockElement !== renderer.domElement) return;
  const P = player;
  if(!P || !P.alive || rewinding) return;
  const sens = CFG.player.sens * 0.0022;
  P.yaw -= e.movementX * sens;
  P.pitch -= e.movementY * sens;
  P.pitch = clamp(P.pitch, -Math.PI/2 + 0.05, Math.PI/2 - 0.05);
});

document.addEventListener('keydown', (e)=>{
  keys[e.key.toLowerCase()] = true;
  if(!gameState.started || gameState.paused) return;
  const k = e.key.toLowerCase();
  if(k==='q'){ e.preventDefault(); triggerRewind(false); }
  else if(k==='r'){ e.preventDefault(); startReload(); }
  else if(k==='1'){ switchWeapon('rifle'); }
  else if(k==='2'){ switchWeapon('shotgun'); }
  else if(k==='3'){ switchWeapon('charger'); }
  else if(k==='e'){ e.preventDefault(); }
  else if(k==='escape'){ /* 退出锁定由浏览器处理 */ }
});

document.addEventListener('keyup', (e)=>{ keys[e.key.toLowerCase()] = false; });

document.addEventListener('mousedown', (e)=>{
  if(e.button===0 && gameState.started && !gameState.paused){
    if(player && player.alive && !rewinding) player.firing = true;
  }
});
document.addEventListener('mouseup', (e)=>{
  if(e.button===0) player.firing = false;
});

/* 指针锁定 */
renderer.domElement.addEventListener('click', ()=>{
  if(!gameState.started) return;
  if(document.pointerLockElement !== renderer.domElement){
    renderer.domElement.requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', ()=>{
  mouse.locked = document.pointerLockElement === renderer.domElement;
  if(!mouse.locked && gameState.started && !gameState.over){
    /* 暂停 */
    gameState.paused = true;
    document.getElementById('pause').style.display = 'flex';
  }
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* 主循环 */
let lastT = performance.now()/1000;
let fpsAccum = 0, fpsFrames = 0;

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now()/1000;
  let dt = now - lastT;
  lastT = now;
  dt = Math.min(dt, 0.05);

  if(!gameState.started) {
    /* 菜单背景：相机缓慢环绕棱镜核心 */
    const t = now * 0.1;
    camera.position.set(Math.sin(t)*16, 5, Math.cos(t)*16);
    camera.lookAt(0, 4, 0);
    renderFrame();
    return;
  }

  if(gameState.paused || gameState.over){
    renderFrame();
    return;
  }

  gameState.time += dt;

  /* 回溯演出中：世界时间推进，但玩家/敌人冻结（演出） */
  if(rewinding){
    updateRewind(dt);
    /* 棱镜核心自转 */
    scene.userData.prism.rotation.y += dt * 1.5;
    renderFrame();
    return;
  }

  /* 玩家 */
  if(player && player.alive){
    player.update(dt, keys, scene.userData.obstacles);
    /* 连续射击 */
    if(player.firing){
      tryFire();
    }
  }

  /* 换弹 */
  updateReload(dt);

  /* 敌人 */
  for(const e of gameState.enemies){
    if(e.alive) e.update(dt, player, scene, gameState.enemies);
  }
  /* 敌弹 */
  updateProjectiles(dt);

  /* 波次 */
  updateWave(dt);

  /* 快照采样 */
  snapAccum += dt;
  if(snapAccum >= SNAP_INTERVAL){
    snapAccum = 0;
    recordSnapshot();
  }

  /* 特效更新 */
  updateTracers(dt);
  /* P1: 粒子雨 */
  if(scene.userData.rain) scene.userData.rain.update(dt);
  updateSparks(dt);

  /* HUD */
  updateHUD(dt);
  updateCrosshairHit(dt);

  /* 棱镜核心自转 */
  scene.userData.prism.rotation.y += dt * 1.5;

  /* FPS 自适应（预留） */
  fpsAccum += dt; fpsFrames++;
  if(fpsAccum >= 5){
    const fps = fpsFrames / fpsAccum;
    fpsAccum = 0; fpsFrames = 0;
    if(fps < 45){
      renderer.setPixelRatio(Math.min(renderer.getPixelRatio(), 1));
    }
  }

  renderFrame();
}

/* 启动 */
bindMenu();
animate();
</script>
