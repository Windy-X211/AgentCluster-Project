<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D模型查看器</title>
<style>
  body{margin:0;overflow:hidden;font-family:Arial}
  #info{position:absolute;top:10px;left:10px;color:#fff;z-index:20}
  #modelList{position:absolute;top:10px;right:10px;color:#fff;background:rgba(0,0,0,0.5);padding:10px;border-radius:5px}
  #modelList select{width:200px}
</style>
</head>
<body>
<div id="info">GLTF 3D 模型查看器（使用 Three.js）</div>
<div id="modelList">
  <label>选择模型: </label>
  <select id="modelSelect"></select>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/loaders/GLTFLoader.js"></script>
<script>
const modelDir='assets/models';
const modelFiles=['Soldier.glb','RobotExpressive.glb','Xbot.glb','Horse.glb','Flamingo.glb'];
const select=document.getElementById('modelSelect');
modelFiles.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;select.appendChild(o);});
select.addEventListener('change',()=>loadModel(`${modelDir}/${select.value}`));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(2,2,5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(5,5,5);scene.add(light);
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.5);scene.add(hemi);
let current=null;const loader=new THREE.GLTFLoader();
function loadModel(url){if(current){scene.remove(current);current=null;}loader.load(url,gltf=>{current=gltf.scene;scene.add(current);},xhr=>{console.log('加载',Math.round(xhr.loaded/xhr.total*100)+'%');},err=>{console.error(err);});}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
loadModel(`${modelDir}/${modelFiles[0]}`);
</script>
</body>
</html>
