<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇 🎮 | 交互式演示</title>

  <!-- 现代排版 -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {--primary:#4f46e5;--primary-dark:#4338ca;--bg:#f1f5f9;--text:#0f172a;--text-muted:#64748b;--radius:0.5rem;--shadow:0 4px 12px rgba(0,0,0,0.1);}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{font-size:16px;font-family:'Roboto',sans-serif;}
    body{color:var(--text);background:var(--bg);line-height:1.6;}

    header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 1px 4px rgba(0,0,0,0.1);}nav{max-width:1200px;margin:auto;padding:1rem;display:flex;justify-content:space-between;align-items:center;}nav .logo{font-weight:700;font-size:1.2rem;}nav ul{display:flex;list-style:none;gap:1.5rem;}nav a{color:var(--text);text-decoration:none;font-weight:500;transition:color 0.3s;}nav a.active{color:var(--primary);}

    section.hero{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><circle fill="%23'+encodeURIComponent('#4f46e5')+'" cx="100" cy="100" r="100" opacity="0.1"/></svg>') no-repeat center/cover;}
    .hero h1{font-size:clamp(2.5rem,6vw,5rem);margin-bottom:0.7rem;} .hero p{font-size:clamp(1.1rem,3vw,1.5rem);color:var(--text-muted);margin-bottom:1.8rem;} .btn{padding:0.8rem 1.9rem;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:1rem;cursor:pointer;transition:background 0.3s,transform 0.2s;} .btn:hover{background:var(--primary-dark);transform:translateY(-2px);}

    section.features{max-width:1200px;margin:auto;padding:4rem 1rem;} .features h2{font-size:2rem;text-align:center;margin-bottom:1.5rem;} .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;} .card{background:#fff;padding:1.7rem;border-radius:var(--radius);box-shadow:var(--shadow);transition:transform 0.3s,box-shadow 0.3s;} .card:hover{transform:translateY(-6px);box-shadow:0 8px 18px rgba(0,0,0,0.15);} .card h3{font-size:1.4rem;color:var(--primary);margin-bottom:0.8rem;} .card p{font-size:1rem;color:var(--text-muted);}

    section.demo{padding:4rem 1rem;background:#fff;text-align:center;} #snakeContainer{margin:auto;max-width:600px;border:4px solid var(--primary);border-radius:var(--radius);overflow:hidden;} #snakeCanvas{display:block;width:100%;height:400px;} #demoInfo{margin-top:1rem;font-size:0.95rem;color:var(--text-muted);}

    footer{background:var(--text);color:#fff;text-align:center;padding:2rem 1rem;} footer a{color:#fff;text-decoration:none;margin:0 0.8rem;} footer a:hover{text-decoration:underline;}

    @media(max-width:600px){nav ul{flex-wrap:wrap;gap:1rem;} .hero h1{font-size:clamp(2rem,6vw,3rem);}}
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">贪吃蛇</div>
      <ul>
        <li><a href="#hero" class="nav-link">首页</a></li>
        <li><a href="#features" class="nav-link">功能</a></li>
        <li><a href="#demo" class="nav-link">演示</a></li>
        <li><a href="#footer" class="nav-link">联系</a></li>
      </ul>
    </nav>
  </header>

  <section id="hero" class="hero">
    <h1>贪吃蛇 🎮</h1>
    <p>经典吃豆类游戏，支持键盘操作，优化了碰撞检测与碰撞预览。</p>
    <button class="btn" onclick="document.getElementById('features').scrollIntoView({behavior:'smooth'})">了解功能</button>
  </section>

  <section id="features" class="features">
    <h2>项目亮点</h2>
    <div class="features-grid">
      <article class="card"><h3><i class="bi bi-gear"></i> 玩法设计</h3><p>字符串长度越大，游戏越有挑战，支持快捷键暂停/继续。</p></article>
      <article class="card"><h3><i class="bi bi-code-slash"></i> 技术栈</h3><p>纯 HTML5 Canvas + ES6，零依赖，完全可嵌入任何页面。</p></article>
      <article class="card"><h3><i class="bi bi-people"></i> 社区</h3><p>开源项目，可自行改造感兴趣的算法或 UI。</p></article>
    </div>
  </section>

  <section id="demo" class="demo">
    <h2>立即试玩</h2>
    <p>使用键盘方向键控制蛇，目标是吃到更多黄色“小方块”以获胜。</p>
    <div id="snakeContainer"><canvas id="snakeCanvas"></canvas></div>
    <p id="demoInfo">按 ESC 键重新开始，Shift+Q 退出游戏</p>
  </section>

  <footer id="footer"><p>© 2026 贪吃蛇项目组 | <a href="https://github.com/your-repo" target="_blank">GitHub</a> | <a href="mailto:example@example.com">联系作者</a></p></footer>

  <script>
    const navLinks=document.querySelectorAll('.nav-link');
    const sections=document.querySelectorAll('section, footer');
    const observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.id;if(!id)return;navLinks.forEach(ln=>ln.classList.remove('active'));if(entry.isIntersecting){document.querySelector(`.nav-link[href="#${id}"]`).classList.add('active');}}),{rootMargin:'-50% 0px -50% 0px'});sections.forEach(sec=>observer.observe(sec));
    (()=>{const canvas=document.getElementById('snakeCanvas');const ctx=canvas.getContext('2d');const gridSize=20;const canvasSize=400;canvas.width=canvasSize;canvas.height=canvasSize;const tileCount=canvasSize/gridSize;let snake=[{x:10,y:10}];let dir={x:0,y:0};let fruit={x:15,y:15};let score=0;let speed=100;let gameInt;let over=false;function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);snake.forEach((seg,i)=>{ctx.fillStyle=i===0?'#4f46e5':'#84befb';ctx.fillRect(seg.x*gridSize,seg.y*gridSize,gridSize,gridSize);ctx.strokeStyle='#fff';ctx.strokeRect(seg.x*gridSize,seg.y*gridSize,gridSize,gridSize);});ctx.fillStyle='#ffca28';ctx.fillRect(fruit.x*gridSize,fruit.y*gridSize,gridSize,gridSize);ctx.fillStyle='#fff';ctx.font='20px Roboto';ctx.fillText(`得分: ${score}`,10,20);}function update(){if(over)return;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};head.x=(head.x+tileCount)%tileCount;head.y=(head.y+tileCount)%tileCount;if(snake.some(s=>s.x===head.x&&s.y===head.y)){over=true;alert('游戏结束！得分: '+score);return;}snake.unshift(head);if(head.x===fruit.x&&head.y===fruit.y){score++;placeFruit();if(score%5===0)speed=Math.max(50,speed-5);}else{snake.pop();}}function loop(){update();draw();}function start(){clearInterval(gameInt);snake=[{x:10,y:10}];dir={x:0,y:0};score=0;speed=100;over=false;placeFruit();gameInt=setInterval(loop,speed);}function placeFruit(){let newF;do{newF={x:Math.floor(Math.random()*tileCount),y:Math.floor(Math.random()*tileCount)}}while(snake.some(s=>s.x===newF.x&&s.y===newF.y));fruit=newF;}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};else if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};else if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};else if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0};else if(e.key==='Escape')start();else if(e.key==='q'&&e.shiftKey)location.reload();});start();})();
  </script>
</body>
</html>
