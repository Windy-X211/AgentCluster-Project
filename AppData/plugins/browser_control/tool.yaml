# browser_control 插件的 tool 定义 — 统一浏览器控制
# 通过 mode 参数选择不同浏览器：system(系统Edge/Chrome) / cdp(桥接到运行中的浏览器) / chromium(内置) / auto(自动)
identity:
  name: "browser_control"
  author: "AgentCluster"
version: "0.1.0"

description:
  zh_Hans: |
    统一浏览器控制：可打开网页并自动执行点击 / 输入 / 抓取 / 截图等。四种后端模式：
      - system: 启动系统 Edge/Chrome（cookie 持久化）
      - cdp: 桥接到正在运行的浏览器（共享登录态/cookies/扩展；需 --remote-debugging-port=9222 启动）
      - chromium: Playwright 内置 Chromium（干净沙箱）
      - auto: 自动选择（优先 cdp > system > chromium），默认。

    操作模板录制（用户录、智能体用）：
    record_start 启动录制面板 → 用户在浏览器正常操作自动捕获 → 面板实时显示步骤，可删除/调序/加注释 → 完成保存到 templates/。
    之后两种用法：record_template_run（固定场景一键回放）、record_template_load（学习步骤后灵活执行，适应页面变化）。

    分层 DOM 提取（省 token）：get_html 默认 format=snapshot 返回结构化快照（去噪后只留可交互元素并编号 @e1..@eN），
    后续 click/type 等 selector 直接传 @eN。需要完整 HTML 再用 format=element（单元素）或 format=raw（整页，慎用）。
    每次调用返回 {ok, data, current_url}；失败带 error。url 需以 http(s):// 开头。
  en_US: |
    Unified browser control. Four backend modes:
      - system: launch system Edge/Chrome (persistent cookies)
      - cdp: bridge to a running browser (shared login state/cookies/extensions; requires --remote-debugging-port=9222)
      - chromium: Playwright built-in Chromium (clean sandbox)
      - auto: auto-select (priority: cdp > system > chromium), default.

    Template recording (user records, agent uses):
    record_start launches a recording panel → user operates normally (auto-captured) → panel shows steps in real time, can delete/reorder/annotate → complete to save to templates/.
    Two usages: record_template_run (one-click replay for fixed scenarios), record_template_load (learn steps then flexibly execute, adapting to page changes).

    Layered DOM extraction (token-efficient): get_html defaults to format=snapshot, a structured snapshot that strips noise,
    keeps interactive elements numbered @e1..@eN; later click/type etc. can pass selector=@eN directly.
    Use format=element for one element's outerHTML, or format=raw for full page HTML (use sparingly).
    Each call returns {ok, data, current_url}; failures include error. url must start with http(s)://.

parameters:
  - name: "action"
    type: string
    required: true
    description: |
      要执行的操作。各值用途与必填参数：
        navigate — 在当前活动标签页打开 URL。必填 url。打开新网站默认用 new_tab；仅当用户明确要求在当前页跳转时才用 navigate。
        new_tab — 新建标签页并设为活动页。url 可选（提供则直接打开）。
        click — 点击元素。selector 传 @eN（来自 snapshot，推荐）或 CSS 选择器。
        coordinate_click — 按归一化坐标点击。必填 x、y ∈ [0.0, 1.0]。适用于无稳定选择器的元素（canvas/自绘UI）。流程：screenshot(inspect) → 识别目标位置换算归一化坐标 → 传入 x、y（插件按 viewport 实时换算像素，切勿传像素）。
        type — 输入文字。必填 selector、text。selector 同 click。
        get_text — 提取元素文本。selector 同 click；缺省取整页 <body> 文本。
        get_html — 分层 DOM 提取，默认 format=snapshot：
            snapshot — 结构化快照。采集语义元素(button/input/a/[role]/h1..h6)、onclick 元素、可聚焦 tabindex、cursor:pointer 自定义可点击元素，去重排序编号 @e1..@eN，缩进表层级。标记：[clickable]=自定义可点击、[offscreen]=视口外、[disabled]=禁用。页面跳转后编号失效需重新 snapshot。找不到元素可 evaluate 查真实 DOM。
            element — 回填单个元素完整 outerHTML。selector 传 @eN 或 CSS。
            raw — 整页/整块原始 HTML，token 消耗大，仅前两者不够时用。
        screenshot — 截图。purpose=inspect（默认）仅供智能体查看；purpose=share 把 base64 data URL 返回给前端在对话区显示缩略图。识别元素位置前必须先截图。
        evaluate — 执行 JavaScript。必填 js。
        wait — 等待秒数。value 默认 1。
        close — 关闭当前浏览器会话。
        info — 查看状态：返回 mode / 当前页 URL / viewport / 所有标签页（index、url、title、是否活动页）。用于多标签页定位。
        focus_tab — 切换操作目标标签页。必填 tab_index（来自 info 的 index）。后续操作作用于该标签页。

      —— 操作模板录制（用户录制）——
      record_start — 开始录制（弹面板）。可选 record_name、record_description。
            ⚠️ 调完此 action 必须立即停止，不要调任何其他浏览器 action！这是用户录制：用户自己操作，你只负责启动并告知"录制已开始"，等用户下一条消息。用户说"好了/保存吧"后再调 record_complete 或 record_template_run。
            触发时机：用户说"帮我录制一个模板"/"把刚才的操作存为模板"等。
      record_status — 查询录制状态。返回 {recording, steps[], meta}。
      record_step_annotate — 给步骤加注释。必填 step_index、annotation（空字符串清除）。用户在面板里直接改；智能体也可主动调。
      record_step_delete — 删除步骤。必填 step_index（删除后剩余步骤 index 自动重排）。
      record_step_reorder — 重排步骤。必填 new_order（0..N-1 的排列，如 [2,1,0]）。
      record_complete — 完成并保存模板到 templates/。可选 template_name / record_name / record_description 覆盖元数据。返回 {ok, template, path, steps_count}。
      record_cancel — 取消录制，丢弃已录步骤。

      —— 模板管理（智能体用）——
      record_template_list — 列出所有已保存模板（name / filename / description / start_url / steps_count / created_at 等）。
      record_template_load — 加载模板完整 JSON。必填 template_name。⭐ 变动场景（页面改版/参数不同/位置偏移）用此方式：拿到步骤后理解每步含义，再用 click/type/navigate 灵活执行。
      record_template_run — 直接回放模板。必填 template_name。⭐ 固定场景（页面稳定）用此方式，最快；页面一变就失败。
      record_template_delete — 删除模板。必填 template_name。不可恢复。

      总结：用户录 → 面板管理 → 保存模板 → 智能体按场景选 run（固定）或 load（灵活）。
      选择规则：先 get_html(snapshot) 拿 @eN → click/type 传 @eN；元素细节不够再 format=element；无稳定元素 → screenshot(inspect) → coordinate_click。
    enum: ["navigate", "new_tab", "click", "coordinate_click", "focus_tab", "type", "get_text", "get_html", "screenshot", "evaluate", "wait", "close", "info", "record_start", "record_status", "record_step_annotate", "record_step_delete", "record_step_reorder", "record_complete", "record_cancel", "record_template_list", "record_template_load", "record_template_run", "record_template_delete"]

  - name: "mode"
    type: string
    required: true
    description: |
      浏览器后端模式：
        auto     — 自动选择（优先 CDP，其次系统浏览器，最后 Chromium）
        system   — 启动系统 Edge/Chrome（channel 方式，独立 context）
        cdp      — 桥接到已运行的浏览器（共享登录态/cookies/扩展）
        chromium — Playwright 内置 Chromium（干净沙箱）
      默认 auto。
    enum: ["auto", "system", "cdp", "chromium"]
    default: "auto"

  - name: "purpose"
    type: string
    required: false
    description: |
      截图用途（仅 screenshot 生效）：
        inspect — 智能体内部查看页面（默认），不落盘不推送到前端。
        share   — 给用户展示。返回 base64 data URL（image_data_url），前端在对话区渲染缩略图。
    enum: ["inspect", "share"]
    default: "inspect"

  - name: "cdp_endpoint"
    type: string
    required: false
    description: "cdp 模式下的远程调试端点，默认 http://127.0.0.1:9222。启动示例：msedge --remote-debugging-port=9222"
    default: ""

  - name: "url"
    type: string
    required: false
    description: "navigate 时必填；new_tab 可选（提供则新标签页直接打开）；screenshot 可选（设置后先跳转再截图）"

  - name: "selector"
    type: string
    required: false
    description: |
      元素定位符，支持三种形式：
        1. @eN — 主文档元素编号（来自 snapshot），如 @e5。
        2. @fNeM — iframe 内元素编号，如 @f1e3（fN=帧号，eM=帧内编号；快照中每帧前有 --- frame fN: title url=... --- 头）。
        3. CSS 选择器 — 如 #submit、.btn-primary。
      click/type/get_text/get_html/evaluate 均接受；get_text/get_html 缺省时作用于整页。

  - name: "format"
    type: string
    required: false
    description: |
      get_html 的提取格式：
        snapshot（默认）— 结构化快照（多帧采集，DOM 瘦身 + 关键元素编号 @eN，子帧加 @fNeM 前缀）。
        element — 单个元素完整 outerHTML，selector 传 @eN/@fNeM/CSS。
        raw — 原始 HTML（整页或指定块），token 消耗大，慎用。
    enum: ["snapshot", "element", "raw"]
    default: "snapshot"

  - name: "text"
    type: string
    required: false
    description: "type 时要输入的文字；evaluate 时要执行的 JS 代码（或用 js 参数）"

  - name: "js"
    type: string
    required: false
    description: "evaluate 时要执行的 JavaScript 代码"

  - name: "value"
    type: number
    required: false
    description: "wait 时等待的秒数，默认 1"
    default: 1

  - name: "x"
    type: number
    required: false
    description: "coordinate_click 的归一化横坐标 ∈ [0.0, 1.0]（0=最左，1=最右）。插件按 viewport 实时换算像素，切勿传像素。必须先截图识别位置。"
    default: -1

  - name: "y"
    type: number
    required: false
    description: "coordinate_click 的归一化纵坐标 ∈ [0.0, 1.0]（0=最上，1=最下）。插件按 viewport 实时换算像素，切勿传像素。必须先截图识别位置。"
    default: -1

  - name: "tab_index"
    type: integer
    required: false
    description: "目标标签页下标（来自 info 的 pages 数组，从 0 开始）。focus_tab 必填；操作类 action 可选——提供则本次操作作用于该标签页，不传则作用于当前活动页。"
    default: -1

  - name: "switch_active"
    type: boolean
    required: false
    description: "是否把 tab_index 指定的标签页切为活动页。true=切换后操作；false（默认）=后台操作不切换。仅当 tab_index 提供时有效。"
    default: false

  - name: "timeout"
    type: number
    required: false
    description: "单次操作超时秒数，默认 15"
    default: 15

  - name: "visible"
    type: boolean
    required: false
    description: "是否以有头模式启动浏览器，默认 true。cdp 模式忽略此参数。"
    default: true

  - name: "record_name"
    type: string
    required: false
    description: "record_start / record_complete 时的模板名称。record_start 可选，默认自动生成 timestamp。"
    default: ""

  - name: "record_description"
    type: string
    required: false
    description: "record_start / record_complete 时的模板描述（说明模板用途）。"
    default: ""

  - name: "template_name"
    type: string
    required: false
    description: "record_complete / record_template_load / record_template_run / record_template_delete 时的模板名称（不带 .json 后缀也可匹配）。"
    default: ""

  - name: "step_index"
    type: integer
    required: false
    description: "record_step_annotate / record_step_delete 时的步骤索引（从 record_status 的 steps[index] 取）。"
    default: -1

  - name: "annotation"
    type: string
    required: false
    description: "record_step_annotate 时的注释文本（空字符串清除）。"
    default: ""

  - name: "new_order"
    type: array
    required: false
    description: "record_step_reorder 时的整数数组，必须是 0..N-1 的排列。如 [2,1,0] 交换第 0 和第 2 步。"

outputs:
  - name: "ok"
    type: boolean
    description: "操作是否成功"
  - name: "data"
    type: string
    description: "操作结果（截图为 base64；get_html(snapshot) 为快照文本；get_html(element/raw) 为 HTML；get_text 为文本；info 为可读摘要）"
  - name: "format"
    type: string
    description: "get_html 时实际采用的格式：snapshot / element / raw"
  - name: "element_count"
    type: integer
    description: "get_html(snapshot) 时快照中编号的元素总数"
  - name: "frames"
    type: array
    description: "get_html(snapshot) 时各帧元数据 [{idx, title, url, count, main}, ...]"
  - name: "truncated"
    type: boolean
    description: "get_html(snapshot) 时是否有帧达 400 元素上限"
  - name: "eid"
    type: string
    description: "get_html(element) 且 selector 为 @eN/@fNeM 时回填的带帧前缀 eid（如 e5 或 f1e3）"
  - name: "image_data_url"
    type: string
    description: "screenshot 且 purpose=share 时的完整 data:image/png;base64,... URL"
  - name: "purpose"
    type: string
    description: "screenshot 时实际采用的用途：inspect / share"
  - name: "current_url"
    type: string
    description: "操作后浏览器地址栏 URL（当前活动页）"
  - name: "error"
    type: string
    description: "失败时的错误信息"
  - name: "pages"
    type: array
    description: "info 时所有已打开标签页 [{index, url, title, is_active}, ...]"
  - name: "active_page_index"
    type: integer
    description: "info 时当前活动页在 pages 中的下标"
  - name: "viewport"
    type: object
    description: "info / get_html(snapshot) 时当前活动页 viewport 尺寸 {w, h}"
