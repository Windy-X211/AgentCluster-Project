# sd_webui 插件 —— 本地 Stable Diffusion WebUI 生图
# 连接本机 A1111/秋叶整合包（aki）的 /sdapi/v1 API，做文生图 / 图生图 / 模型与参数管理。

version: "0.1.0"
type: "plugin"
name: "sd_webui"
label:
  zh_Hans: "本地生图（SD WebUI）"
  en_US: "Local SD WebUI"
author: "AgentCluster"
description:
  zh_Hans: |
    连接本地 Stable Diffusion WebUI（默认 http://127.0.0.1:7860）生成图片。

    ★ 核心能力 ★
    1. 文生图（txt2img）：把 LLM 扩写好的完整提示词交给 SD 生成图片
    2. 图生图（img2img）：传入参考图 base64 或本地路径，按重绘幅度再创作
    3. 模型管理：列出/切换大模型、采样器、LoRA、Embedding、放大器
    4. 任务控制：查询生成进度、中断生成
    5. 反向提示词：negative_prompt 过滤不想要的元素，支持 CFG、采样步数、高清修复等完整参数

    ★ 调用约定 ★
    调用前应先由语言模型把用户需求扩写成完整英文提示词（含画质词/风格/构图/光线），
    同时给出合适的 negative_prompt，再填入 prompt / negative_prompt 参数。
  en_US: |
    Connect to a local Stable Diffusion WebUI (default http://127.0.0.1:7860) to generate images.

    ★ Core Capabilities ★
    1. txt2img: pass a fully-written prompt to SD to generate images
    2. img2img: pass a reference image (base64 or local path) with denoising strength
    3. Model management: list/switch checkpoints, samplers, LoRA, embeddings, upscalers
    4. Task control: query progress, interrupt generation
    5. Negative prompt + CFG, steps, hires.fix and full parameter control

    The language model should first expand the user's idea into a complete English prompt
    (quality/style/composition/lighting tags) and a suitable negative_prompt before calling.
version_code: 1
icon: "🎨"
tags: ["image", "stablediffusion", "txt2img", "img2img", "sd-webui"]

dependencies:
  external:
    - name: "Stable Diffusion WebUI（A1111 / 秋叶整合包）"
      url: "https://github.com/AUTOMATIC1111/stable-diffusion-webui"
      description: "必装。需以 --api 参数启动（默认监听 http://127.0.0.1:7860），插件通过 HTTP 调用其 /sdapi/v1 API"
