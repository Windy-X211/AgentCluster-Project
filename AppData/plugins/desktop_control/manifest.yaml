# desktop_control 插件 —— 桌面控制

version: "0.1.0"
type: "plugin"
name: "desktop_control"
label:
  zh_Hans: "桌面控制"
  en_US: "Desktop Control"
author: "AgentCluster"
description:
  zh_Hans: |
    桌面控制插件，支持屏幕截图、鼠标交互、键盘输入、屏幕录制、音频采集。

    ★ 核心能力 ★
    1. 区域截图（双模式）：
       - inspect 模式：返回 base64 数据，不保存到本地
       - save 模式：保存到指定路径
    2. 鼠标交互：单击、双击、右键、滚动、拖动
    3. 键盘输入：单键、组合键、文字输入（含中文适配）
    4. 屏幕录制：区域/全屏、暂停/恢复/停止/丢弃、音频采集
    5. 等待操作：阻塞指定时长

    ★ 中文输入适配 ★
    含中文等 Unicode 字符时强制走「剪贴板粘贴」方案（保存剪贴板 → 写入 → Ctrl+V → 恢复剪贴板），不依赖输入法状态。

    ★ 录制浮层 ★
    录制期间固定右下角显示红点 + "REC" + 状态 + 时长浮层，浮层不进入最终视频画面。

    适用场景：UI 自动化测试、屏幕操作录制、视觉分析、远程协助。
  en_US: |
    Desktop control plugin with screenshot, mouse, keyboard, screen recording, and audio capture.

    ★ Core Capabilities ★
    1. Regional screenshot (dual mode):
       - inspect: returns base64 data, not saved locally
       - save: saves to specified path
    2. Mouse: click, double-click, right-click, scroll, drag
    3. Keyboard: single key, hotkey, text input (with Chinese support)
    4. Screen recording: region/fullscreen, pause/resume/stop/discard, audio capture
    5. Wait: blocks for specified duration

    ★ Chinese Input Support ★
    For Chinese/Unicode text, uses clipboard paste (save → write → Ctrl+V → restore), independent of IME state.

    ★ Recording Overlay ★
    Fixed bottom-right overlay showing red dot + "REC" + status + elapsed time. Overlay not included in final video.

    Use cases: UI automation testing, screen operation recording, visual analysis, remote assistance.
version_code: 2
icon: "🖥️"
tags: ["desktop", "automation", "screenshot", "mouse", "keyboard", "recording"]

dependencies:
  pip:
    - "mss>=9.0.0"
    - "pyautogui>=0.9.54"
    - "pyperclip>=1.8.2"
    - "Pillow>=9.0.0"
    - "numpy>=1.24.0"
    - "opencv-python>=4.8.0"
