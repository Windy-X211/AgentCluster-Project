identity:
  name: "everything_search"
  author: "AgentCluster"
version: "0.0.2"
description:
  zh_Hans: "用本机 Everything 快速搜索文件或应用。action=open 直接启动应用；action=search 返回匹配文件的绝对路径列表；支持 name_only/ext/path/大小/日期过滤。"
  en_US: "Search files/apps via local Everything SDK. action=open launches an app; action=search returns matched absolute paths. Supports name_only/ext/path/size/date filters."
parameters:
  - name: "action"
    type: "string"
    required: true
    enum: ["search", "open"]
    description: "search=返回匹配文件路径列表；open=按名字解析为 .exe 并启动应用"
  - name: "query"
    type: "string"
    required: false
    default: ""
    description: "搜索关键词或 Everything 表达式（例如 'vscode'、'foo bar'、'!.lock'）"
  - name: "name_only"
    type: "boolean"
    required: false
    default: false
    description: "true=只搜索文件名（不搜路径/内容片段），用于精确找应用或文件"
  - name: "ext"
    type: "string"
    required: false
    default: ""
    description: "扩展名过滤，例如 'exe' 或 'py;md;txt'（不含点）"
  - name: "path"
    type: "string"
    required: false
    default: ""
    description: "限定搜索目录，支持通配符，例如 'D:\\*' 或 'C:\\Users\\*' "
  - name: "size_min"
    type: "integer"
    required: false
    default: 0
    description: "最小字节数（0=不限）"
  - name: "size_max"
    type: "integer"
    required: false
    default: 0
    description: "最大字节数（0=不限）"
  - name: "mdate_min"
    type: "string"
    required: false
    default: ""
    description: "最早修改日期，例如 '2024-01-01' 或 'yesterday' 或 'lastweek'"
  - name: "mdate_max"
    type: "string"
    required: false
    default: ""
    description: "最晚修改日期，同上格式"
  - name: "hidden"
    type: "integer"
    required: false
    default: 0
    description: "0=不含隐藏；1=仅隐藏；2=全部"
  - name: "limit"
    type: "integer"
    required: false
    default: 30
    description: "最多返回条数（1-1000）"
  - name: "offset"
    type: "integer"
    required: false
    default: 0
    description: "跳过前 N 条（分页用）"
outputs:
  - name: "count"
    type: "integer"
    description: "匹配总数"
  - name: "results"
    type: "array"
    description: "匹配结果数组：search 时是路径字符串；open 时是 {path, launched}"
  - name: "query_used"
    type: "string"
    description: "实际发给 Everything 的完整查询字符串"